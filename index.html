<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Pro - المساعد الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --c1: #6366f1; --c1d: #4f46e5; --c1l: #eef2ff;
            --bg: #f1f5f9; --sur: #ffffff; --sur2: #f8fafc;
            --tx: #0f172a; --tx2: #475569; --tx3: #94a3b8;
            --br: #e2e8f0; --sh: 0 1px 2px rgba(0,0,0,0.05);
            --sh2: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
            --sh3: 0 10px 25px rgba(0,0,0,0.08);
            --r: 14px; --r2: 20px; --r3: 24px;
            --tr: 0.2s ease;
        }
        .dark {
            --bg: #0b1120; --sur: #111827; --sur2: #1a2332;
            --tx: #f1f5f9; --tx2: #94a3b8; --tx3: #64748b;
            --br: #1e293b; --sh: 0 1px 2px rgba(0,0,0,0.3);
            --sh2: 0 4px 6px rgba(0,0,0,0.3); --sh3: 0 10px 25px rgba(0,0,0,0.4);
            --c1l: #1e1b4b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            font-family:'Tajawal',sans-serif;
            background:var(--bg); color:var(--tx);
            min-height:100vh; display:flex; flex-direction:column;
            line-height:1.7; transition:background var(--tr),color var(--tr);
            -webkit-tap-highlight-color:transparent;
        }
        /* ===== TOP BAR ===== */
        .topbar {
            background:var(--sur); border-bottom:1px solid var(--br);
            padding:12px 24px; display:flex; align-items:center;
            justify-content:space-between; gap:16px;
            position:sticky; top:0; z-index:50; box-shadow:var(--sh);
        }
        .logo {
            display:flex; align-items:center; gap:10px;
            font-size:1.1rem; font-weight:800; color:var(--c1);
        }
        .logo span {
            width:38px; height:38px; background:linear-gradient(135deg,var(--c1),var(--c1d));
            border-radius:var(--r); display:flex; align-items:center;
            justify-content:center; font-size:1.3rem; color:white;
        }
        .nav-links { display:flex; gap:4px; }
        .nav-links a {
            padding:8px 16px; border-radius:20px; font-size:0.8rem;
            font-weight:500; text-decoration:none; color:var(--tx2);
            transition:all var(--tr); white-space:nowrap;
        }
        .nav-links a:hover { background:var(--sur2); color:var(--tx); }
        .nav-links a.active { background:var(--c1); color:white; }
        .nav-actions { display:flex; gap:6px; align-items:center; }
        .icon-btn {
            width:36px; height:36px; border-radius:50%; border:none;
            background:transparent; color:var(--tx2); cursor:pointer;
            font-size:1rem; display:flex; align-items:center;
            justify-content:center; transition:all var(--tr);
        }
        .icon-btn:hover { background:var(--sur2); color:var(--tx); }

        /* ===== RATES TICKER ===== */
        .ticker {
            background:var(--sur); border-bottom:1px solid var(--br);
            padding:8px 24px; display:flex; gap:20px; overflow-x:auto;
            font-size:0.7rem; font-weight:500; white-space:nowrap;
            scrollbar-width:none;
        }
        .ticker::-webkit-scrollbar { display:none; }
        .ticker-item { color:var(--tx2); display:flex; align-items:center; gap:4px; }
        .ticker-item .up { color:#10b981; } .ticker-item .down { color:#ef4444; }

        /* ===== CHAT ===== */
        .main-chat {
            flex:1; max-width:800px; width:100%; margin:0 auto;
            padding:20px 20px 16px; display:flex; flex-direction:column;
            overflow:hidden;
        }
        .msg-list {
            flex:1; overflow-y:auto; padding:4px 2px 20px;
            display:flex; flex-direction:column; gap:16px;
        }
        .msg-list::-webkit-scrollbar { width:4px; }
        .msg-list::-webkit-scrollbar-thumb { background:var(--br); border-radius:10px; }

        .msg {
            display:flex; gap:10px; max-width:88%;
            animation:slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .msg.user { align-self:flex-end; flex-direction:row-reverse; }
        .msg.bot { align-self:flex-start; }
        .msg-av {
            width:34px; height:34px; border-radius:50%; display:flex;
            align-items:center; justify-content:center; font-size:0.95rem;
            flex-shrink:0;
        }
        .msg.user .msg-av { background:linear-gradient(135deg,var(--c1),var(--c1d)); color:white; }
        .msg.bot .msg-av { background:var(--br); }
        .msg-body { flex:1; min-width:0; }
        .msg-bubble {
            padding:10px 16px; border-radius:var(--r2); font-size:0.88rem;
            line-height:1.8; word-wrap:break-word; white-space:pre-wrap;
        }
        .msg.user .msg-bubble {
            background:linear-gradient(135deg,var(--c1),#8b5cf6);
            color:white; border-bottom-right-radius:4px;
        }
        .msg.bot .msg-bubble {
            background:var(--sur2); color:var(--tx);
            border:1px solid var(--br); border-bottom-left-radius:4px;
        }
        .msg-actions {
            display:flex; gap:4px; margin-top:4px; opacity:0;
            transition:opacity 0.2s;
        }
        .msg:hover .msg-actions { opacity:1; }
        .act-btn {
            padding:3px 8px; border-radius:6px; border:none;
            background:rgba(0,0,0,0.04); color:var(--tx2);
            cursor:pointer; font-size:0.65rem; font-family:inherit;
            transition:all var(--tr);
        }
        .act-btn:hover { background:var(--c1); color:white; }

        /* ===== SUGGESTIONS ===== */
        .sugs {
            display:flex; gap:6px; flex-wrap:wrap; padding:6px 0;
            justify-content:center;
        }
        .sug {
            padding:7px 14px; border-radius:20px; border:1px solid var(--br);
            background:var(--sur); color:var(--tx); font-size:0.74rem;
            font-family:inherit; cursor:pointer; transition:all var(--tr);
        }
        .sug:hover { border-color:var(--c1); color:var(--c1); background:var(--c1l); }

        /* ===== INPUT ===== */
        .input-box {
            background:var(--sur); border:2px solid var(--br);
            border-radius:var(--r3); display:flex; align-items:flex-end;
            padding:6px 8px 6px 18px; gap:6px; transition:all var(--tr);
            box-shadow:var(--sh2);
        }
        .input-box:focus-within { border-color:var(--c1); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
        .input-box textarea {
            flex:1; border:none; outline:none; resize:none;
            font-family:inherit; font-size:0.88rem; background:transparent;
            padding:8px 0; color:var(--tx); max-height:100px; line-height:1.5;
        }
        .input-box textarea::placeholder { color:var(--tx3); }
        .send-btn {
            width:42px; height:42px; border-radius:50%; border:none;
            background:var(--c1); color:white; font-size:1.1rem;
            cursor:pointer; flex-shrink:0; transition:all var(--tr);
            display:flex; align-items:center; justify-content:center;
        }
        .send-btn:hover { background:var(--c1d); transform:scale(1.05); }
        .send-btn:disabled { background:var(--br); cursor:not-allowed; transform:none; }

        .typing { display:flex; gap:4px; padding:10px 12px; }
        .typing span { width:6px; height:6px; border-radius:50%; background:var(--tx3); animation:bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay:0.2s; }
        .typing span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-7px);} }

        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(120px);
            background:#1e293b; color:white; padding:10px 24px; border-radius:30px;
            font-size:0.8rem; z-index:999; opacity:0; transition:all 0.3s;
            box-shadow:var(--sh3); pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ===== FOOTER ===== */
        footer {
            text-align:center; padding:12px; font-size:0.7rem;
            color:var(--tx3); border-top:1px solid var(--br); background:var(--sur);
        }
        footer strong { color:var(--c1); }

        @media (max-width:640px) {
            .main-chat { padding:12px 10px; }
            .msg { max-width:95%; }
            .msg-bubble { padding:8px 12px; font-size:0.8rem; }
            .topbar { padding:10px 14px; }
            .nav-links a { padding:6px 10px; font-size:0.7rem; }
            .input-box { border-radius:var(--r2); padding:4px 6px 4px 12px; }
            .ticker { padding:6px 14px; font-size:0.65rem; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="logo"><span>🤖</span>AI Chat Pro</div>
        <nav class="nav-links">
            <a href="index.html" class="active">💬 المحادثة</a>
            <a href="tools.html">🧰 الأدوات</a>
            <a href="labs.html">🧪 المختبر</a>
        </nav>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="تغيير المظهر">🌙</button>
        </div>
    </header>

    <!-- RATES TICKER -->
    <div class="ticker" id="ticker">⏳ جاري تحميل الأسعار الحية...</div>

    <!-- CHAT -->
    <div class="main-chat">
        <div class="msg-list" id="msgList"></div>

        <div class="sugs">
            <button class="sug" data-q="/rates">💱 أسعار الصرف</button>
            <button class="sug" data-q="/convert 100 USD to IQD">💵 تحويل عملات</button>
            <button class="sug" data-q="ما هو الذكاء الاصطناعي؟">🧠 ما هو AI</button>
            <button class="sug" data-q="/calc 25% من 500">🔢 آلة حاسبة</button>
            <button class="sug" data-q="/joke">😂 نكتة</button>
            <button class="sug" data-q="/weather بغداد">🌤️ طقس</button>
        </div>

        <div class="input-box">
            <textarea id="userInput" rows="1" placeholder="اكتب رسالتك... (/help للأوامر)"></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <footer>© <strong>أحمد الجابري</strong> - جميع الحقوق محفوظة 2026</footer>

    <script>
        (() => {
            const $ = id => document.getElementById(id);
            const msgList = $('msgList'), inp = $('userInput'), send = $('sendBtn');
            const ticker = $('ticker'), toast = $('toast'), themeBtn = $('themeBtn');

            let busy = false, speaking = false, synth = speechSynthesis;
            let personality = localStorage.getItem('pers') || 'default';
            let bm = JSON.parse(localStorage.getItem('bm') || '[]');
            let total = parseInt(localStorage.getItem('totalMsgs') || '0');
            let rates = {}, prevRates = {};

            const pers = { default:'🤖', friend:'😊', teacher:'👨‍🏫', expert:'💼', chef:'👨‍🍳', doctor:'🩺', coder:'💻' };

            function toastMsg(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('show'), 2200); }

            function toggleTheme() {
                const d = document.body.classList.toggle('dark');
                themeBtn.textContent = d ? '☀️' : '🌙';
                localStorage.setItem('dark', d ? '1' : '0');
            }
            if (localStorage.getItem('dark') === '1') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }

            // RATES
            async function fetchRates() {
                try {
                    const r = await fetch('https://open.er-api.com/v6/latest/USD');
                    const d = await r.json();
                    if (d?.rates) { prevRates = { ...rates }; rates = d.rates; renderTicker(); }
                } catch (e) {
                    if (!Object.keys(rates).length) {
                        rates = { USD:1, EUR:0.92, GBP:0.79, IQD:1310, SAR:3.75, AED:3.67, EGP:47.5, JPY:149, TRY:30.5, CNY:7.24 };
                        renderTicker();
                    }
                }
            }
            function renderTicker() {
                const p = [['دولار/دينار','IQD'],['دولار/ريال','SAR'],['دولار/درهم','AED'],['دولار/جنيه','EGP'],['يورو/دولار','EUR'],['باوند/دولار','GBP']];
                ticker.innerHTML = p.map(([l, c]) => {
                    const v = c === 'EUR' ? (1/rates.EUR).toFixed(4) : c === 'GBP' ? (1/rates.GBP).toFixed(4) : rates[c]?.toFixed(2) || '--';
                    const pr = prevRates[c]; let ar = '';
                    if (pr && rates[c]) ar = rates[c] > pr ? ' <span class="up">▲</span>' : rates[c] < pr ? ' <span class="down">▼</span>' : '';
                    return `<span class="ticker-item">${l}: ${v}${ar}</span>`;
                }).join('');
            }
            fetchRates(); setInterval(fetchRates, 60000);
            function getRate(f, t) { if (!rates[f] || !rates[t]) return null; return (1/rates[f])*rates[t]; }

            function scrollBot() { msgList.scrollTop = msgList.scrollHeight; }
            function autoResize() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 100) + 'px'; }

            async function copyTxt(t, b) { try { await navigator.clipboard.writeText(t); b.textContent = '✅'; setTimeout(() => b.textContent = '📋', 1500); } catch (e) {} }
            function speakTxt(t, b) {
                if (speaking) { synth.cancel(); speaking = false; b.textContent = '🔊'; return; }
                synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; u.rate = 0.9;
                const v = synth.getVoices().find(x => x.lang.startsWith('ar')); if (v) u.voice = v;
                u.onstart = () => { speaking = true; b.textContent = '⏹'; };
                u.onend = () => { speaking = false; b.textContent = '🔊'; };
                synth.speak(u);
            }
            function toggleBm(t) { const i = bm.indexOf(t); i > -1 ? bm.splice(i, 1) : bm.push(t); localStorage.setItem('bm', JSON.stringify(bm)); }

            function addMsg(text, who, save = true) {
                const div = document.createElement('div'); div.className = `msg ${who}`;
                const av = document.createElement('div'); av.className = 'msg-av'; av.textContent = who === 'user' ? '👤' : (pers[personality] || '🤖');
                const body = document.createElement('div'); body.className = 'msg-body';
                const bub = document.createElement('div'); bub.className = 'msg-bubble'; bub.textContent = text;
                body.appendChild(bub);
                const acts = document.createElement('div'); acts.className = 'msg-actions';
                [
                    ['📋', (btn) => copyTxt(text, btn)],
                    ['🔊', (btn) => speakTxt(text, btn)],
                    ['⭐', (btn) => { toggleBm(text); btn.textContent = bm.includes(text) ? '★' : '⭐'; }]
                ].forEach(([ico, fn]) => {
                    const btn = document.createElement('button'); btn.className = 'act-btn'; btn.textContent = bm.includes(text) && ico === '⭐' ? '★' : ico; btn.addEventListener('click', () => fn(btn)); acts.appendChild(btn);
                });
                body.appendChild(acts); div.appendChild(av); div.appendChild(body); msgList.appendChild(div); scrollBot();
                if (save) { total++; localStorage.setItem('totalMsgs', total.toString()); saveHist(); }
            }

            function showTyping() {
                const el = document.createElement('div'); el.className = 'msg bot'; el.id = 'typingInd';
                el.innerHTML = '<div class="msg-av">🤖</div><div class="typing"><span></span><span></span><span></span></div>';
                msgList.appendChild(el); scrollBot();
            }
            function hideTyping() { const el = $('typingInd'); if (el) el.remove(); }

            function saveHist() {
                const msgs = []; msgList.querySelectorAll('.msg').forEach(m => { const b = m.querySelector('.msg-bubble'); if (b) msgs.push({ s: m.classList.contains('user') ? 'u' : 'b', t: b.textContent }); });
                localStorage.setItem('hist', JSON.stringify(msgs));
            }
            function loadHist() {
                const s = localStorage.getItem('hist');
                if (s) { try { msgList.innerHTML = ''; JSON.parse(s).forEach(m => addMsg(m.t, m.s === 'u' ? 'user' : 'bot', false)); } catch (e) { localStorage.removeItem('hist'); } }
                if (!msgList.children.length) addMsg('👋 مرحباً بك!\n\n💱 الأسعار تتحدث كل دقيقة\n📋 /help لرؤية كل الأوامر\n💡 جرب: /rates | /convert | /calc | /joke', 'bot', false);
                scrollBot();
            }

            function handleCmd(msg) {
                const m = msg.trim();
                if (m === '/rates') {
                    let r = '💱 **أسعار الصرف الحية**\n\n';
                    r += `🇺🇸 1 دولار أمريكي:\n`;
                    r += `• دينار عراقي: ${rates.IQD?.toFixed(2) || '--'}\n`;
                    r += `• ريال سعودي: ${rates.SAR?.toFixed(2) || '--'}\n`;
                    r += `• درهم إماراتي: ${rates.AED?.toFixed(2) || '--'}\n`;
                    r += `• جنيه مصري: ${rates.EGP?.toFixed(2) || '--'}\n`;
                    r += `• يورو: ${rates.EUR?.toFixed(4) || '--'}\n`;
                    r += `• باوند: ${rates.GBP?.toFixed(4) || '--'}\n`;
                    r += `• ين ياباني: ${rates.JPY?.toFixed(2) || '--'}\n`;
                    r += `• ليرة تركية: ${rates.TRY?.toFixed(2) || '--'}\n`;
                    r += `\n🕐 ${new Date().toLocaleTimeString('ar-SA')} | ⏱️ تحديث كل دقيقة`;
                    return r;
                }
                if (m.startsWith('/calc ')) { try { return `🔢 ${m.replace('/calc ','')} = ${Function('return ('+m.replace('/calc ','')+')')()}`; } catch(e) { return '⚠️ خطأ. مثال: /calc 5*10+3'; } }
                if (m.startsWith('/convert ')) { const p = m.replace('/convert ','').split(' '); const a = parseFloat(p[0]), f = p[1]?.toUpperCase(), t = p[3]?.toUpperCase() || p[2]?.toUpperCase(); const r = getRate(f, t); if (r) return `💵 ${a} ${f} = ${(a*r).toFixed(4)} ${t}\n📊 1 ${f} = ${r.toFixed(4)} ${t}`; return '⚠️ مثال: /convert 100 USD to IQD\nالعملات: USD EUR GBP IQD SAR AED EGP JPY TRY'; }
                if (m.startsWith('/weather ')) return `🌤️ الطقس في ${m.replace('/weather ','')}: جرب البحث في الويب عن "weather ${m.replace('/weather ','')}"`;
                if (m === '/time') return `🕐 ${new Date().toLocaleString('ar-SA')}`;
                if (m === '/date') return `📅 ${new Date().toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}`;
                if (m === '/joke') { const j = ['ليش المبرمج تعبان؟ bugs!','HTML بدون CSS = جسم بدون روح','أفضل لغة؟ اللي تدفعلك راتب']; return `😂 ${j[Math.floor(Math.random()*3)]}`; }
                if (m === '/idea') { const i = ['تطبيق تعلم بالذكاء الاصطناعي','متجر منتجات رقمية','بوت تحليل أسعار','منصة تواصل للمبرمجين']; return `💡 ${i[Math.floor(Math.random()*4)]}`; }
                if (m === '/help') return '📋 الأوامر:\n/rates - أسعار الصرف\n/convert [مبلغ] [من] to [الى]\n/calc [معادلة]\n/weather [مدينة]\n/time | /date | /joke | /idea\n/name | /diet | /cv | /notes';
                if (m.startsWith('/name')) { const n = ['نور','لين','سما','فارس','آدم','جود']; return `🏷️ ${n[Math.floor(Math.random()*6)]}`; }
                if (m === '/diet') return '🍳 نظام 1800 سعرة:\n🥗 فطور: بيض + خبز\n🍗 غداء: دجاج + رز\n🥦 عشاء: خضار + سمك';
                if (m === '/cv') return '💼 نموذج CV:\n👤 الاسم:\n🎓 التعليم:\n💼 الخبرات:\n🔧 المهارات:\n📞 التواصل:';
                if (m === '/notes') { const n = JSON.parse(localStorage.getItem('notes') || '[]'); return n.length ? '📝 ملاحظات:\n'+n.map((x,i) => `${i+1}. ${x.t}`).join('\n') : 'لا ملاحظات.'; }
                return null;
            }

            async function searchWeb(q) {
                try { const r = await fetch(`https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=2`); const d = await r.json(); if (d?.query?.search?.length) { const pid = d.query.search[0].pageid; const er = await fetch(`https://ar.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&pageids=${pid}&format=json&origin=*`); const ed = await er.json(); const pg = ed?.query?.pages?.[pid]; if (pg?.extract?.trim().length > 20) { let t = pg.extract.trim().replace(/\s+/g,' '); if (t.length > 500) t = t.substring(0,500)+'...'; return t+'\n\n📚 ويكيبيديا'; } } } catch(e) {}
                try { const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1`); const d = await r.json(); let t = d.AbstractText?.trim() || ''; if (!t && d.RelatedTopics?.length) t = d.RelatedTopics[0].Text || ''; if (t.length > 10) { t = t.replace(/\s+/g,' '); if (t.length > 500) t = t.substring(0,500)+'...'; return t+'\n\n📚 DuckDuckGo'; } } catch(e) {}
                return '⚠️ لم أجد نتائج. تأكد من الإنترنت.';
            }

            async function handleSend(msgText) {
                const msg = msgText || inp.value.trim(); if (!msg || busy) return;
                busy = true; send.disabled = true; inp.disabled = true;
                if (!msgText) { inp.value = ''; inp.style.height = 'auto'; }
                addMsg(msg, 'user'); showTyping();
                const cmd = handleCmd(msg);
                const reply = cmd || await searchWeb(msg);
                hideTyping(); addMsg(reply, 'bot');
                busy = false; send.disabled = false; inp.disabled = false; inp.focus();
            }

            send.addEventListener('click', () => handleSend());
            inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
            inp.addEventListener('input', autoResize);
            document.querySelectorAll('.sug').forEach(b => b.addEventListener('click', () => handleSend(b.dataset.q)));

            loadHist(); inp.focus();
        })();
    </script>
</body>
</html>
