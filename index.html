<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>شركة الحساب الذهني الدولية | نظام إدارة العقود المتقدم</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f7f4;
            color: #1e2f3a;
            overflow-x: hidden;
        }

        /* الحاوية الرئيسية - تخطيط مرن */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* شريط التنقل الأفقي على الجانب الأيمن (عمودي لكن المحتوى أفقي) - تصميم مبتكر: عمودي لكن الأزرار بشكل أفقي؟ لا، حسب الطلب: "شريط التنقل في الاسفل اريده على جهة اليمين افقياً" 
           أي قائمة أفقية موضوعة على الجانب الأيمن (جهة اليمين) بشكل أفقي. سننشئ sidebar-right لكن العناصر display flex أفقياً مع لف للشاشات الصغيرة */
        .nav-sidebar {
            width: 260px;
            background: linear-gradient(145deg, #0a2f2f, #0b3b3b);
            backdrop-filter: blur(2px);
            box-shadow: -5px 0 25px rgba(0, 30, 20, 0.12);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 20;
            transition: all 0.2s;
            border-left: 1px solid rgba(80, 180, 120, 0.3);
        }

        /* شعار القسم */
        .brand-compact {
            padding: 32px 18px;
            text-align: center;
            border-bottom: 2px solid #2c8c5a;
            margin-bottom: 20px;
        }
        .brand-compact h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #c3f0d8;
            letter-spacing: -0.5px;
        }
        .brand-compact p {
            font-size: 0.7rem;
            color: #b3dfc7;
        }

        /* القائمة الأفقية داخل العمود الجانبي (اتجاه عمودي لكن العناصر تمتد بشكل أفقي على اليمين؟ لا.. العمود الجانبي يبقى عمودي ولكن عناصر القائمة توضع بشكل أفقي داخل مساحة العمود: flex-direction row مع wrap */
        .nav-horizontal {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 16px 12px;
            margin: 8px 0;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #eefcf5;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
        }
        .nav-btn i {
            font-size: 1rem;
        }
        .nav-btn.active {
            background: #2ecc71;
            color: #0a2f2f;
            box-shadow: 0 6px 14px rgba(46, 204, 113, 0.3);
        }
        .nav-btn:hover:not(.active) {
            background: #1f8a55;
            transform: translateY(-2px);
        }

        /* محتوى الصفحة الرئيسي (يسار) */
        .content-area {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            background: #f4fbf8;
        }

        /* البطاقات الاحترافية */
        .glass-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 28px 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 32, 20, 0.08);
            margin-bottom: 30px;
            border: 1px solid rgba(46, 204, 113, 0.2);
            transition: 0.2s;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 28px;
            border-right: 6px solid #2ecc71;
            padding-right: 20px;
            color: #0a3b2f;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* شبكة المدارس */
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 28px;
            margin-top: 15px;
        }

        .school-item {
            background: #ffffff;
            border-radius: 32px;
            padding: 20px;
            transition: all 0.2s;
            border: 1px solid #dcfce7;
            box-shadow: 0 5px 12px rgba(0,0,0,0.02);
        }
        .school-item:hover {
            border-color: #2ecc71;
            transform: translateY(-4px);
        }
        .school-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #1d6f48;
            margin-bottom: 8px;
        }
        .contract-desc {
            font-size: 0.85rem;
            background: #eefaf2;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            margin: 10px 0;
        }
        .contract-img {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 24px;
            margin: 12px 0;
            border: 1px solid #c0f0d0;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            justify-content: flex-start;
        }
        .btn-icon {
            background: #f2f9f5;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-edit { background: #e3f2fd; color: #0a6e9e; }
        .btn-delete { background: #fee9e6; color: #c0392b; }
        .btn-edit:hover { background: #bbdef5; }
        .btn-delete:hover { background: #fcd5ce; }

        /* نموذج إضافة مدرسة (موحد) */
        .form-modern {
            background: #f9fffc;
            border-radius: 32px;
            padding: 25px;
            margin-top: 15px;
            border: 1px solid #d0f0e0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
            color: #1f5e45;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1.5px solid #c8e6d9;
            font-family: 'Cairo', sans-serif;
            background: white;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46,204,113,0.2);
        }
        .btn-primary {
            background: #2ecc71;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #0a2f2f;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #27ae60;
            transform: scale(1.01);
        }
        .video-placeholder iframe {
            width: 100%;
            border-radius: 32px;
            min-height: 280px;
        }
        .steps-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }
        .step-card {
            flex: 1;
            background: #eefaf3;
            padding: 20px;
            border-radius: 28px;
            text-align: center;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #558b6e;
        }
        @media (max-width: 850px) {
            .app-wrapper {
                flex-direction: column;
            }
            .nav-sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                padding: 12px;
                overflow-x: auto;
            }
            .brand-compact {
                display: none;
            }
            .nav-horizontal {
                flex-wrap: nowrap;
                justify-content: flex-start;
            }
            .content-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- شريط التنقل الأيمن (أفقي داخل الجانب الأيمن) -->
    <div class="nav-sidebar">
        <div class="brand-compact">
            <h1>الحساب الذهني</h1>
            <p>الدولية | ذكاء بلا حدود</p>
        </div>
        <div class="nav-horizontal">
            <button class="nav-btn active" data-nav="home"><i class="fas fa-home"></i> الرئيسية</button>
            <button class="nav-btn" data-nav="schools"><i class="fas fa-school"></i> المدارس & العقود</button>
            <button class="nav-btn" data-nav="addSchool"><i class="fas fa-plus-circle"></i> إضافة مدرسة</button>
            <button class="nav-btn" data-nav="system"><i class="fas fa-chalkboard-user"></i> نظام العمل</button>
        </div>
        <div style="margin-top: auto; padding: 20px 12px; text-align: center; font-size:0.7rem; color:#9acdb5;">
            <i class="fas fa-brain"></i> 2025 © جميع الحقوق محفوظة
        </div>
    </div>

    <!-- المحتوى الديناميكي -->
    <div class="content-area" id="dynamicContent">
        <!-- سيتم تحميل المحتوى بواسطة js -->
        <div class="glass-card" style="text-align:center;">جاري تجهيز لوحة القيادة...</div>
    </div>
</div>

<script>
    // ------------------- قاعدة بيانات المدارس والعقود (مع صور مخزنة محلياً) -------------------
    let schools = [
        { id: 1, name: "مدارس النخبة الحديثة", contractDesc: "عقد شراكة استراتيجي 2025", imageData: "https://picsum.photos/id/106/300/180" },
        { id: 2, name: "أكاديمية العباقرة الذهنيين", contractDesc: "تجديد التعاون حتى 2026", imageData: "https://picsum.photos/id/20/300/180" },
        { id: 3, name: "مدارس الفرسان العالمية", contractDesc: "عقد حصري لمناهج الحساب الذهني", imageData: "https://picsum.photos/id/26/300/180" }
    ];

    // مساعد لتخزين الصور المرفوعة (base64 أو objectURL) - سنستخدم objectURL لكنه مؤقت، لكن سيتم تخزين بيانات الصور كـ dataURL من أجل الاستمرارية (تحويل الملف إلى base64)
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // عرض صفحة المدارس والعقود (مع إمكانية التعديل/الحذف)
    function renderSchoolsManagementPage() {
        let schoolsHtml = `<div class="glass-card">
            <div class="section-title"><i class="fas fa-handshake"></i> المدارس المتعاقدة مع الشركة وعقودها</div>
            <div class="schools-grid" id="schoolsGridContainer">`;
        
        if (schools.length === 0) {
            schoolsHtml += `<div style="grid-column:1/-1; text-align:center; padding:40px;">لا توجد مدارس مسجلة، أضف مدرسة جديدة من القائمة</div>`;
        } else {
            schools.forEach(school => {
                schoolsHtml += `
                    <div class="school-item" data-id="${school.id}">
                        <div class="school-name"><i class="fas fa-landmark"></i> ${escapeHtml(school.name)}</div>
                        <div class="contract-desc"><i class="fas fa-file-contract"></i> ${escapeHtml(school.contractDesc)}</div>
                        <img src="${school.imageData}" class="contract-img" alt="صورة العقد" onerror="this.src='https://placehold.co/300x180?text=صورة+العقد'">
                        <div class="action-buttons">
                            <button class="btn-icon btn-edit" onclick="editSchool(${school.id})"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="btn-icon btn-delete" onclick="deleteSchool(${school.id})"><i class="fas fa-trash-alt"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
        }
        schoolsHtml += `</div></div>`;
        return schoolsHtml;
    }

    // صفحة إضافة مدرسة جديدة (رفع صورة واحدة + بيانات موحدة)
    function renderAddSchoolPage() {
        return `
        <div class="glass-card">
            <div class="section-title"><i class="fas fa-school-circle-check"></i> إضافة مدرسة متعاقدة جديدة</div>
            <div class="form-modern">
                <div class="form-group">
                    <label><i class="fas fa-building"></i> اسم المدرسة <span style="color:#e67e22;">*</span></label>
                    <input type="text" id="schoolNameInput" placeholder="مثال: مدارس الحساب الذهني النموذجية">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-file-signature"></i> وصف العقد / التفاصيل</label>
                    <textarea id="contractDescInput" rows="2" placeholder="عقد تعاون استراتيجي، مدة سنتين..."></textarea>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-image"></i> رفع صورة العقد (من الجهاز فقط)</label>
                    <input type="file" id="contractImageFile" accept="image/jpeg,image/png,image/jpg,image/webp">
                    <div style="font-size:0.75rem; color:#2c6e49; margin-top:6px;">⚠️ يرجى اختيار صورة للعقد أو الاتفاقية</div>
                </div>
                <button class="btn-primary" id="submitNewSchoolBtn"><i class="fas fa-save"></i> تسجيل المدرسة والعقد</button>
                <div id="addSchoolMsg" style="margin-top: 15px; font-weight:500;"></div>
            </div>
        </div>`;
    }

    // صفحة نظام العمل + فيديو توضيحي
    function renderSystemWorkPage() {
        return `
        <div class="glass-card">
            <div class="section-title"><i class="fas fa-gear"></i> نظام عمل شركة الحساب الذهني الدولية</div>
            <p style="font-size:1.05rem; line-height:1.7;">تعتمد الشركة على منهجية متكاملة تجمع بين الحساب الذهني (السوروبان) وتقنيات تنشيط الذاكرة والتصور الذهني. يتم تقديم البرنامج عبر مستويات:</p>
            <div class="steps-container">
                <div class="step-card"><i class="fas fa-chalkboard-user" style="font-size:2rem;color:#2ecc71;"></i><h3>التأسيس</h3><p>تعليم أساسيات العداد الذهني والأرقام</p></div>
                <div class="step-card"><i class="fas fa-brain" style="font-size:2rem;color:#2ecc71;"></i><h3>التصور الذهني</h3><p>الانتقال إلى الحساب الذهني بدون عداد</p></div>
                <div class="step-card"><i class="fas fa-trophy" style="font-size:2rem;color:#2ecc71;"></i><h3>الاحتراف والمسابقات</h3><p>مسابقات دولية وشهادات معتمدة</p></div>
            </div>
            <h3 style="margin: 20px 0 12px 0;"><i class="fas fa-video"></i> فيديو توضيحي عن الحساب الذهني</h3>
            <div class="video-placeholder">
                <iframe width="100%" height="320" src="https://www.youtube.com/embed/8e3nNuJ_aBY" title="شرح الحساب الذهني" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <footer>تطبق شركة الحساب الذهني الدولية أعلى معايير الجودة في تدريب المدربين واعتماد المناهج.</footer>
        </div>`;
    }

    // الصفحة الرئيسية
    function renderHomePage() {
        return `
        <div class="glass-card">
            <div class="section-title"><i class="fas fa-crown"></i> شركة الحساب الذهني الدولية</div>
            <p style="font-size:1.2rem; font-weight:500;">نحو جيل مبدع بعقول ذهنية استثنائية. نحن الريادة في تعليم الحساب الذهني، ونقدم عقود شراكة موثقة مع المدارس وصور العقود بشكل رقمي.</p>
            <div style="background: linear-gradient(120deg, #e2f7ea, #ffffff); border-radius: 28px; padding: 24px; margin: 28px 0;">
                <i class="fas fa-chart-simple" style="font-size: 2.2rem; color:#2ecc71;"></i>
                <h3>لماذا نحن؟</h3>
                <p>✔ أكثر من 200 مدرسة متعاقدة<br>✔ نظام متكامل لإدارة العقود<br>✔ تدريب معتمد وتقنيات حديثة</p>
            </div>
            <div><i class="fas fa-arrow-left"></i> استخدم القائمة الجانبية اليمنى للاطلاع على المدارس والعقود، إضافة مدارس جديدة، أو مشاهدة نظام العمل.</div>
        </div>`;
    }

    // دوال التعديل والحذف العامة
    window.editSchool = function(id) {
        const school = schools.find(s => s.id === id);
        if (!school) return;
        const newName = prompt("تعديل اسم المدرسة:", school.name);
        if (newName && newName.trim() !== "") school.name = newName.trim();
        const newDesc = prompt("تعديل وصف العقد:", school.contractDesc);
        if (newDesc !== null) school.contractDesc = newDesc;
        // تعديل الصورة: يمكن رفع صورة جديدة من الجهاز كخيار إضافي
        const changeImg = confirm("هل تريد تغيير صورة العقد؟ (اختر نعم لرفع صورة جديدة من جهازك)");
        if (changeImg) {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const base64 = await fileToBase64(file);
                    school.imageData = base64;
                    refreshCurrentPage();
                }
            };
            fileInput.click();
        } else {
            refreshCurrentPage();
        }
        refreshCurrentPage();
    };

    window.deleteSchool = function(id) {
        if (confirm("هل أنت متأكد من حذف هذه المدرسة وجميع بيانات العقد؟")) {
            schools = schools.filter(s => s.id !== id);
            refreshCurrentPage();
        }
    };

    // تحديث الصفحة الحالية بناءً على التبويب النشط
    let currentActiveTab = "home";
    function refreshCurrentPage() {
        if (currentActiveTab === "home") loadContent("home");
        else if (currentActiveTab === "schools") loadContent("schools");
        else if (currentActiveTab === "addSchool") loadContent("addSchool");
        else if (currentActiveTab === "system") loadContent("system");
    }

    async function loadContent(tab) {
        currentActiveTab = tab;
        const container = document.getElementById("dynamicContent");
        if (!container) return;
        if (tab === "home") {
            container.innerHTML = renderHomePage();
        } else if (tab === "schools") {
            container.innerHTML = renderSchoolsManagementPage();
        } else if (tab === "addSchool") {
            container.innerHTML = renderAddSchoolPage();
            // ربط حدث إضافة المدرسة (رفع صورة + بيانات)
            const submitBtn = document.getElementById("submitNewSchoolBtn");
            if (submitBtn) {
                submitBtn.onclick = async () => {
                    const nameInput = document.getElementById("schoolNameInput");
                    const descTextarea = document.getElementById("contractDescInput");
                    const fileInput = document.getElementById("contractImageFile");
                    const schoolName = nameInput?.value.trim();
                    if (!schoolName) {
                        document.getElementById("addSchoolMsg").innerHTML = '<span style="color:#c0392b;">يرجى إدخال اسم المدرسة</span>';
                        return;
                    }
                    if (!fileInput.files || fileInput.files.length === 0) {
                        document.getElementById("addSchoolMsg").innerHTML = '<span style="color:#c0392b;">يرجى رفع صورة العقد من جهازك (صورة أو مستند)</span>';
                        return;
                    }
                    const file = fileInput.files[0];
                    const base64Image = await fileToBase64(file);
                    const contractDesc = descTextarea?.value.trim() || "عقد شراكة مع شركة الحساب الذهني الدولية";
                    const newId = Date.now();
                    schools.push({
                        id: newId,
                        name: schoolName,
                        contractDesc: contractDesc,
                        imageData: base64Image
                    });
                    // مسح الحقول
                    nameInput.value = "";
                    if (descTextarea) descTextarea.value = "";
                    fileInput.value = "";
                    document.getElementById("addSchoolMsg").innerHTML = '<span style="color:#27ae60;">✅ تمت إضافة المدرسة والعقد بنجاح!</span>';
                    setTimeout(() => {
                        const msgDiv = document.getElementById("addSchoolMsg");
                        if(msgDiv) msgDiv.innerHTML = "";
                    }, 2500);
                    // تحديث صفحة المدارس إذا كانت مفتوحة لاحقًا، أو تحويل تلقائي
                    if (currentActiveTab === "addSchool") {
                        // بعد الإضافة نعطي خيار الانتقال للمدارس
                        const goToSchools = confirm("تمت الإضافة بنجاح! هل تريد الانتقال إلى قائمة المدارس الآن؟");
                        if (goToSchools) {
                            document.querySelector('[data-nav="schools"]').click();
                        } else {
                            refreshCurrentPage();
                        }
                    } else {
                        refreshCurrentPage();
                    }
                };
            }
        } else if (tab === "system") {
            container.innerHTML = renderSystemWorkPage();
        }
    }

    // دالة للهروب من الـ XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // تهيئة التنقل وتحديث active
    function initNavigation() {
        const navBtns = document.querySelectorAll('.nav-btn');
        navBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const navValue = this.getAttribute('data-nav');
                if (!navValue) return;
                navBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                loadContent(navValue);
            });
        });
    }

    // تحميل الصفحة الافتراضية
    initNavigation();
    loadContent("home");
</script>
</body>
</html>
