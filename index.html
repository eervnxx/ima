<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VACT - المساعد الذكي | Gemini AI</title>
    <meta name="author" content="أحمد الجابري">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="logo-icon">⚡</span>
                    <h2>VACT</h2>
                </div>
                <button class="toggle-sidebar" id="toggleSidebarBtn">☰</button>
            </div>
            
            <div class="user-info-section">
                <h3>👤 تخصيص التجربة</h3>
                <div class="input-group">
                    <label for="userName">الاسم</label>
                    <input type="text" id="userName" placeholder="اسمك (اختياري)">
                </div>
                <div class="input-group">
                    <label for="userInterest">الاهتمامات</label>
                    <input type="text" id="userInterest" placeholder="مثلاً: برمجة، تصميم">
                </div>
                <div class="input-group">
                    <label for="responseStyle">أسلوب الرد</label>
                    <select id="responseStyle">
                        <option value="detailed">📝 ردود مفصلة</option>
                        <option value="concise">⚡ ردود مختصرة</option>
                        <option value="creative">🎨 أسلوب إبداعي</option>
                        <option value="professional">💼 أسلوب مهني</option>
                    </select>
                </div>
                <button id="savePrefsBtn" class="save-btn">💾 حفظ التفضيلات</button>
            </div>
            
            <div class="chat-history">
                <h3>💬 المحادثات</h3>
                <button id="newChatBtn" class="new-chat-btn">✨ محادثة جديدة</button>
                <div id="historyList" class="history-list"></div>
            </div>
            
            <div class="developer-credit">
                <p>© 2026 <strong>VACT</strong></p>
                <p>تطوير: <strong>أحمد الجابري</strong></p>
            </div>
        </aside>
        
        <main class="chat-area">
            <header class="chat-header">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <h1>VACT</h1>
                </div>
                <div class="status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">متصل</span>
                </div>
            </header>
            
            <div class="messages-container" id="messages">
                <div class="welcome-message">
                    <div class="bot-avatar">🤖</div>
                    <div class="message-content">
                        <h2>مرحباً بك في VACT! ⚡</h2>
                        <p>المساعد الذكي المدعوم بـ <strong>Gemini AI</strong></p>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <div class="input-container">
                    <textarea id="userInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                    <div class="input-buttons">
                        <button id="clearChatBtn" class="clear-btn">🗑️</button>
                        <button id="exportChatBtn" class="export-btn">📥</button>
                        <button id="sendBtn" class="send-btn">
                            <span>إرسال</span> 📤
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="footer-bar">
                <p>© 2026 <strong>VACT</strong> | تطوير: <strong>أحمد الجابري</strong></p>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
