<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي الأسطوري - Ultimate AI Chat</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: rgba(99,102,241,0.1);
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --user-msg: #6366f1;
            --ai-msg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.3s ease;
            --online: #22c55e;
            --offline: #ef4444;
            --star: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --code-bg: #1e293b;
        }
        body.dark-mode {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --ai-msg: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4);
            --primary-light: rgba(99,102,241,0.2);
            --code-bg: #0d1117;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI','Tajawal',Tahoma,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            line-height:1.6;
            transition:background var(--transition),color var(--transition);
        }

        .splash {
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:var(--bg);z-index:999;display:flex;
            align-items:center;justify-content:center;flex-direction:column;
            animation:fadeOut 0.5s 1.5s forwards;pointer-events:none;
        }
        @keyframes fadeOut { to { opacity:0;visibility:hidden; } }
        .splash h1 { font-size:3rem;animation:bounceIn 0.6s; }
        @keyframes bounceIn { 0%{transform:scale(0);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }
        .splash p { color:var(--text-secondary);margin-top:10px; }

        .navbar {
            background:var(--surface);border-bottom:1px solid var(--border);
            padding:0 14px;display:flex;align-items:center;justify-content:space-between;
            height:48px;position:sticky;top:0;z-index:100;gap:6px;
        }
        .nav-brand { font-weight:700;color:var(--primary);font-size:0.95rem;display:flex;align-items:center;gap:5px; }
        .nav-links { display:flex;gap:3px;align-items:center;flex-wrap:wrap; }
        .nav-link {
            background:transparent;border:1px solid var(--border);color:var(--text-secondary);
            padding:4px 9px;border-radius:14px;cursor:pointer;font-size:0.7rem;
            font-family:inherit;transition:all var(--transition);white-space:nowrap;text-decoration:none;
        }
        .nav-link:hover,.nav-link.active { background:var(--primary);color:white;border-color:var(--primary); }
        .nav-icon {
            background:var(--primary-light);border:none;color:var(--primary);
            width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:0.85rem;
            transition:all var(--transition);position:relative;
        }
        .nav-icon:hover { background:var(--primary);color:white; }
        .badge {
            position:absolute;top:-4px;right:-4px;background:var(--danger);color:white;
            font-size:0.55rem;width:16px;height:16px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;
        }

        .status-bar {
            background:var(--surface);border-bottom:1px solid var(--border);
            padding:3px 14px;display:flex;align-items:center;justify-content:space-between;
            font-size:0.65rem;color:var(--text-secondary);gap:6px;flex-wrap:wrap;
        }
        .status-dot { width:7px;height:7px;border-radius:50%;background:var(--online);display:inline-block;margin-left:3px; }
        .status-dot.offline { background:var(--offline); }

        .chat-container {
            flex:1;max-width:900px;width:100%;margin:0 auto;
            padding:10px 12px;display:flex;flex-direction:column;overflow:hidden;
        }
        .messages-area {
            flex:1;overflow-y:auto;padding:6px 2px 14px;display:flex;
            flex-direction:column;gap:12px;scroll-behavior:smooth;
        }
        .messages-area::-webkit-scrollbar { width:5px; }
        .messages-area::-webkit-scrollbar-track { background:transparent; }
        .messages-area::-webkit-scrollbar-thumb { background:#cbd5e1;border-radius:20px; }

        .message { display:flex;gap:7px;animation:fadeIn 0.35s ease;max-width:88%; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
        .message.user { align-self:flex-end;flex-direction:row-reverse; }
        .message.ai { align-self:flex-start; }
        .message.pinned { border:2px solid var(--star);border-radius:var(--radius);padding:4px; }
        .avatar {
            width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;font-size:0.95rem;flex-shrink:0;
            background:var(--surface);border:2px solid var(--border);
        }
        .message.user .avatar { background:var(--primary);border-color:var(--primary);color:white; }
        .message.ai .avatar { background:#e2e8f0;border-color:#cbd5e1; }
        .bubble-wrapper { position:relative;flex:1;min-width:0; }
        .bubble {
            padding:10px 14px;border-radius:var(--radius);word-wrap:break-word;
            white-space:pre-wrap;line-height:1.7;font-size:0.88rem;box-shadow:var(--shadow);
        }
        .message.user .bubble { background:var(--user-msg);color:#fff;border-bottom-left-radius:4px; }
        .message.ai .bubble { background:var(--ai-msg);color:var(--text);border:1px solid var(--border);border-bottom-right-radius:4px; }
        .bubble code {
            background:var(--code-bg);color:#e2e8f0;padding:2px 6px;border-radius:4px;
            font-family:'Courier New',monospace;font-size:0.8rem;display:inline-block;margin:2px 0;
        }
        .bubble pre {
            background:var(--code-bg);color:#e2e8f0;padding:10px;border-radius:var(--radius-sm);
            overflow-x:auto;font-family:'Courier New',monospace;font-size:0.78rem;margin:6px 0;
        }
        .bubble strong { color:var(--primary); }
        .bubble h3 { font-size:1rem;color:var(--primary);margin:6px 0; }
        .bubble ul,.bubble ol { margin:4px 16px; }

        .message-actions {
            display:flex;gap:2px;margin-top:3px;opacity:0;
            transition:opacity 0.2s;flex-wrap:wrap;
        }
        .message.ai:hover .message-actions,.message.user:hover .message-actions { opacity:1; }
        .msg-action {
            background:rgba(0,0,0,0.04);border:none;color:var(--text-secondary);
            padding:2px 5px;border-radius:3px;cursor:pointer;font-size:0.6rem;transition:all 0.2s;
        }
        .msg-action:hover { background:rgba(0,0,0,0.12);color:var(--text); }
        .msg-action.fav.active { background:rgba(245,158,11,0.2);color:var(--star); }
        .msg-action.rate-up.active { color:var(--success); }
        .msg-action.rate-down.active { color:var(--danger); }

        .typing-indicator { display:flex;gap:4px;padding:8px 12px;align-self:flex-start; }
        .typing-indicator .dot {
            width:6px;height:6px;border-radius:50%;background:#94a3b8;
            animation:bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator .dot:nth-child(1){animation-delay:0s;}
        .typing-indicator .dot:nth-child(2){animation-delay:0.2s;}
        .typing-indicator .dot:nth-child(3){animation-delay:0.4s;}
        @keyframes bounce { 0%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-8px);} }

        .suggestions { display:flex;gap:5px;flex-wrap:wrap;padding:5px 0;justify-content:center; }
        .sug-btn {
            background:var(--surface);border:1px solid var(--border);color:var(--text);
            padding:5px 10px;border-radius:14px;cursor:pointer;font-size:0.7rem;
            font-family:inherit;transition:all var(--transition);
        }
        .sug-btn:hover { background:var(--primary-light);border-color:var(--primary);color:var(--primary); }
        .history-bar { display:flex;gap:4px;flex-wrap:wrap;padding:4px 0;justify-content:center; }
        .hist-btn {
            background:var(--bg);border:1px solid var(--border);color:var(--text-secondary);
            padding:3px 8px;border-radius:10px;cursor:pointer;font-size:0.65rem;
            font-family:inherit;max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
        }
        .hist-btn:hover { background:var(--primary-light);color:var(--primary); }

        .input-row {
            background:var(--surface);border:1px solid var(--border);border-radius:24px;
            display:flex;align-items:center;padding:3px 3px 3px 14px;margin-top:6px;
            box-shadow:var(--shadow);transition:border var(--transition),box-shadow var(--transition);
        }
        .input-row:focus-within { border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
        .input-row textarea {
            flex:1;border:none;outline:none;resize:none;font-family:inherit;
            font-size:0.88rem;background:transparent;padding:7px 0;color:var(--text);
            max-height:90px;line-height:1.5;
        }
        .input-row textarea::placeholder { color:#94a3b8; }
        .send-btn {
            background:var(--primary);color:white;border:none;width:36px;height:36px;
            border-radius:50%;cursor:pointer;font-size:0.95rem;transition:all var(--transition);flex-shrink:0;
        }
        .send-btn:hover { background:var(--primary-hover);transform:scale(1.05); }
        .send-btn:disabled { background:#cbd5e1;cursor:not-allowed;transform:none; }
        .mic-btn {
            background:var(--primary-light);border:none;color:var(--primary);
            width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.85rem;
            transition:all var(--transition);margin:0 3px;
        }
        .mic-btn:hover { background:var(--primary);color:white; }
        .mic-btn.recording { background:var(--danger);color:white;animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }

        .search-bar {
            display:none;padding:5px 12px;background:var(--surface);
            border-bottom:1px solid var(--border);gap:5px;align-items:center;
        }
        .search-bar.active { display:flex; }
        .search-bar input {
            flex:1;border:1px solid var(--border);border-radius:16px;padding:5px 10px;
            font-family:inherit;font-size:0.78rem;background:var(--bg);color:var(--text);
        }
        .search-bar button {
            background:var(--primary);color:white;border:none;padding:4px 10px;
            border-radius:12px;cursor:pointer;font-family:inherit;font-size:0.68rem;
        }

        .modal {
            display:none;position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.6);z-index:200;justify-content:center;align-items:center;
        }
        .modal.active { display:flex; }
        .modal-box {
            background:var(--surface);padding:22px;border-radius:var(--radius);
            max-width:530px;width:93%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);
        }
        .modal-box h3 { margin-bottom:12px;color:var(--primary); }
        .modal-box button {
            background:var(--primary);color:white;border:none;padding:8px 16px;
            border-radius:16px;cursor:pointer;font-family:inherit;margin:2px;font-size:0.78rem;
        }
        .modal-box button.close-btn { background:#cbd5e1;color:#1e293b; }

        .toast {
            position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(100px);
            background:#1e293b;color:white;padding:9px 20px;border-radius:22px;
            font-size:0.78rem;z-index:300;opacity:0;transition:all 0.3s;pointer-events:none;
        }
        .toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

        .footer {
            text-align:center;padding:10px;font-size:0.7rem;color:var(--text-secondary);
            border-top:1px solid var(--border);background:var(--surface);
        }
        .footer span { font-weight:600;color:var(--primary); }
        .footer a { color:var(--primary);text-decoration:none;margin:0 4px; }

        @media (max-width:600px) {
            .chat-container { padding:6px 5px; }
            .message { max-width:96%; }
            .bubble { padding:8px 10px;font-size:0.78rem; }
            .avatar { width:26px;height:26px;font-size:0.7rem; }
            .nav-link { padding:3px 6px;font-size:0.6rem; }
            .splash h1 { font-size:2rem; }
        }
    </style>
</head>
<body>

    <div class="splash"><h1>🤖</h1><p>المساعد الذكي الأسطوري</p><p style="font-size:0.8rem;">+100 ميزة في 3 صفحات</p></div>

    <nav class="navbar">
        <div class="nav-brand">🤖 الأسطوري</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link active">💬 شات</a>
            <a href="tools.html" class="nav-link">🧰 أدوات</a>
            <a href="labs.html" class="nav-link">🧪 مختبر</a>
            <button class="nav-icon" id="focusModeBtn" title="تركيز">🎯</button>
            <button class="nav-icon" id="searchToggleBtn" title="بحث Ctrl+K">🔍</button>
            <button class="nav-icon" id="darkModeBtn" title="ليلي Ctrl+D">🌙</button>
            <button class="nav-icon" id="historyBtn" title="سجل">🕐<span class="badge" id="historyBadge">0</span></button>
        </div>
    </nav>

    <div class="status-bar" id="statusBar">
        <span><span class="status-dot" id="statusDot"></span> <span id="statusText">متصل</span></span>
        <span id="statsInfo">📊 0 رسالة</span>
        <span id="clockDisplay"></span>
    </div>

    <div class="search-bar" id="searchBar">
        <input type="text" id="searchInput" placeholder="🔍 ابحث...">
        <button id="searchPrevBtn">▲</button>
        <button id="searchNextBtn">▼</button>
        <button id="searchCloseBtn">✕</button>
        <span id="searchCount" style="font-size:0.65rem;"></span>
    </div>

    <div class="chat-container">
        <div class="messages-area" id="messagesArea"></div>
        <div class="history-bar" id="historyBar"></div>
        <div class="suggestions" id="suggestionsArea">
            <button class="sug-btn" data-q="ما هو الذكاء الاصطناعي؟">🧠 AI</button>
            <button class="sug-btn" data-q="كيف أتعلم البرمجة؟">💻 برمجة</button>
            <button class="sug-btn" data-q="/convert 100 USD to IQD">💱 عملات</button>
            <button class="sug-btn" data-q="/calc 25% من 500">🔢 حاسبة</button>
            <button class="sug-btn" data-q="/weather بغداد">🌤️ طقس</button>
            <button class="sug-btn" data-q="/joke">😂 نكتة</button>
        </div>
        <div class="input-row">
            <textarea id="userInput" rows="1" placeholder="اكتب سؤالك... /help للأوامر"></textarea>
            <button class="mic-btn" id="micBtn" title="صوت">🎤</button>
            <span id="charCount" style="font-size:0.6rem;color:var(--text-secondary);margin:0 2px;"></span>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <div class="modal" id="personalityModal">
        <div class="modal-box">
            <h3>🎭 الشخصية</h3>
            <button data-p="default">🤖 افتراضي</button><button data-p="friend">😊 صديق</button>
            <button data-p="teacher">👨‍🏫 أستاذ</button><button data-p="expert">💼 خبير</button>
            <button data-p="chef">👨‍🍳 شيف</button><button data-p="doctor">🩺 طبيب</button>
            <button data-p="poet">🎤 شاعر</button><button data-p="coder">💻 مبرمج</button>
            <br><br><button class="close-btn" onclick="document.getElementById('personalityModal').classList.remove('active')">إغلاق</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <footer class="footer" id="footerBar">
        © <span>أحمد الجابري - المطور</span> |
        <a href="#" onclick="document.getElementById('personalityModal').classList.add('active');return false;">🎭</a>
        <a href="#" onclick="exportChat();return false;">📄</a>
        <a href="#" onclick="shareChat();return false;">🔗</a>
        <a href="#" onclick="clearAll();return false;" style="color:var(--danger);">🗑️</a>
    </footer>

    <script>
        (function(){
            const $=id=>document.getElementById(id);
            const messagesArea=$('messagesArea'),userInput=$('userInput'),sendBtn=$('sendBtn');
            const darkModeBtn=$('darkModeBtn'),statusDot=$('statusDot'),statusText=$('statusText');
            const statsInfo=$('statsInfo'),clockDisplay=$('clockDisplay'),toast=$('toast');
            const charCount=$('charCount'),micBtn=$('micBtn'),searchBar=$('searchBar');
            const searchInput=$('searchInput'),searchCount=$('searchCount'),historyBar=$('historyBar');
            const historyBadge=$('historyBadge'),focusModeBtn=$('focusModeBtn');
            const statusBar=$('statusBar'),footerBar=$('footerBar'),suggestionsArea=$('suggestionsArea');

            let isWaiting=false,isSpeaking=false,synth=window.speechSynthesis;
            let personality=localStorage.getItem('personality')||'default';
            let bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]');
            let totalMessages=parseInt(localStorage.getItem('totalMessages')||'0');
            let searchMatches=[],searchIdx=-1;
            let searchHistory=JSON.parse(localStorage.getItem('searchHistory')||'[]');
            let ratings=JSON.parse(localStorage.getItem('ratings')||'{}');
            let pinnedMsg=localStorage.getItem('pinnedMsg')||null;
            let isFocusMode=false;

            const personalities={
                default:{name:'افتراضي',emoji:'🤖'},friend:{name:'صديق',emoji:'😊'},
                teacher:{name:'أستاذ',emoji:'👨‍🏫'},expert:{name:'خبير',emoji:'💼'},
                chef:{name:'شيف',emoji:'👨‍🍳'},doctor:{name:'طبيب',emoji:'🩺'},
                poet:{name:'شاعر',emoji:'🎤'},coder:{name:'مبرمج',emoji:'💻'}
            };

            function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._timeout);toast._timeout=setTimeout(()=>toast.classList.remove('show'),2000);}
            function updateClock(){clockDisplay.textContent=new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
            setInterval(updateClock,1000);updateClock();

            function updateOnline(){const o=navigator.onLine;statusDot.classList.toggle('offline',!o);statusText.textContent=o?'متصل':'غير متصل';}
            window.addEventListener('online',updateOnline);window.addEventListener('offline',updateOnline);updateOnline();

            function updateStats(){statsInfo.textContent=`📊 ${totalMessages} رسالة`;}updateStats();

            function toggleDark(){document.body.classList.toggle('dark-mode');const d=document.body.classList.contains('dark-mode');darkModeBtn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d?'on':'off');}
            if(localStorage.getItem('darkMode')==='on'){document.body.classList.add('dark-mode');darkModeBtn.textContent='☀️';}
            darkModeBtn.addEventListener('click',toggleDark);

            $('searchToggleBtn').addEventListener('click',()=>{searchBar.classList.toggle('active');if(searchBar.classList.contains('active'))searchInput.focus();});
            $('searchCloseBtn').addEventListener('click',()=>{searchBar.classList.remove('active');clearHighlights();});
            searchInput.addEventListener('input',doSearch);
            $('searchPrevBtn').addEventListener('click',()=>navSearch(-1));
            $('searchNextBtn').addEventListener('click',()=>navSearch(1));

            function doSearch(){clearHighlights();const q=searchInput.value.trim().toLowerCase();if(!q){searchMatches=[];searchCount.textContent='';return;}searchMatches=[];messagesArea.querySelectorAll('.bubble').forEach(b=>{if(b.textContent.toLowerCase().includes(q))searchMatches.push(b);});searchIdx=searchMatches.length>0?0:-1;searchCount.textContent=searchMatches.length?`${searchIdx+1}/${searchMatches.length}`:'0';highlight();}
            function navSearch(d){if(!searchMatches.length)return;searchIdx=(searchIdx+d+searchMatches.length)%searchMatches.length;highlight();searchMatches[searchIdx].scrollIntoView({behavior:'smooth',block:'center'});searchCount.textContent=`${searchIdx+1}/${searchMatches.length}`;}
            function highlight(){searchMatches.forEach(b=>b.style.outline='none');if(searchIdx>=0&&searchMatches[searchIdx])searchMatches[searchIdx].style.outline='2px solid var(--primary)';}
            function clearHighlights(){document.querySelectorAll('.bubble').forEach(b=>b.style.outline='none');searchMatches=[];searchIdx=-1;}

            focusModeBtn.addEventListener('click',()=>{isFocusMode=!isFocusMode;statusBar.style.display=isFocusMode?'none':'flex';footerBar.style.display=isFocusMode?'none':'block';suggestionsArea.style.display=isFocusMode?'none':'flex';historyBar.style.display=isFocusMode?'none':'flex';focusModeBtn.style.background=isFocusMode?'var(--primary)':'var(--primary-light)';focusModeBtn.style.color=isFocusMode?'white':'var(--primary)';showToast(isFocusMode?'🎯 تركيز':'🌐 عادي');});

            async function copyText(text,btn){try{await navigator.clipboard.writeText(text);btn.textContent='✅';setTimeout(()=>btn.textContent='📋',1500);showToast('📋 نسخ');}catch(e){showToast('⚠️ فشل');}}
            function speakText(text,btn){if(isSpeaking){synth.cancel();isSpeaking=false;btn.textContent='🔊';return;}synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=0.9;const v=synth.getVoices().find(x=>x.lang.startsWith('ar'));if(v)u.voice=v;u.onstart=()=>{isSpeaking=true;btn.textContent='⏹️';};u.onend=()=>{isSpeaking=false;btn.textContent='🔊';};u.onerror=()=>{isSpeaking=false;btn.textContent='🔊';};synth.speak(u);}
            async function translateText(text,btn){try{btn.textContent='⏳';const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);const d=await r.json();const t=d[0].map(x=>x[0]).join('');const bubble=btn.closest('.message')?.querySelector('.bubble');if(bubble){bubble.textContent=`🌐 [EN]: ${t}\n\n---\n${text}`;saveHistory();}btn.textContent='🌐';showToast('🌐 ترجمة');}catch(e){btn.textContent='🌐';showToast('⚠️ فشل');}}
            function toggleBookmark(text){const idx=bookmarks.indexOf(text);if(idx>-1){bookmarks.splice(idx,1);showToast('⭐ أزيل');}else{bookmarks.push(text);showToast('⭐ أضيف');}localStorage.setItem('bookmarks',JSON.stringify(bookmarks));}
            function isBookmarked(text){return bookmarks.includes(text);}
            function rateMessage(text,type){const key=text.substring(0,100);if(!ratings[key])ratings[key]={up:0,down:0};ratings[key][type]=(ratings[key][type]||0)+1;localStorage.setItem('ratings',JSON.stringify(ratings));showToast(type==='up'?'👍':'👎');}
            function pinMessage(el){const bubble=el.closest('.message')?.querySelector('.bubble');if(!bubble)return;const text=bubble.textContent;if(pinnedMsg===text){pinnedMsg=null;localStorage.removeItem('pinnedMsg');showToast('📌 أزيل');}else{pinnedMsg=text;localStorage.setItem('pinnedMsg',text);showToast('📌 تثبيت');}document.querySelectorAll('.message').forEach(m=>m.classList.remove('pinned'));if(pinnedMsg){document.querySelectorAll('.bubble').forEach(b=>{if(b.textContent===pinnedMsg)b.closest('.message')?.classList.add('pinned');});}}

            function formatMarkdown(text){let t=text;t=t.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');t=t.replace(/`([^`]+)`/g,'<code>$1</code>');t=t.replace(/^### (.+)/gm,'<h3>$1</h3>');t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/^\- (.+)/gm,'<ul><li>$1</li></ul>');t=t.replace(/^(\d+)\. (.+)/gm,'<ol><li>$2</li></ol>');return t;}

            function addMsg(content,sender,save=true){const d=document.createElement('div');d.className=`message ${sender}`;if(pinnedMsg===content)d.classList.add('pinned');const av=document.createElement('div');av.className='avatar';av.textContent=sender==='user'?'👤':(personalities[personality]?.emoji||'🤖');const bw=document.createElement('div');bw.className='bubble-wrapper';const b=document.createElement('div');b.className='bubble';b.innerHTML=formatMarkdown(content);bw.appendChild(b);const act=document.createElement('div');act.className='message-actions';[['📋','نسخ',(btn)=>copyText(content,btn)],['🔊','قراءة',(btn)=>speakText(content,btn)],['🌐','ترجمة',(btn)=>translateText(content,btn)],['⭐','مفضلة',(btn)=>{toggleBookmark(content);btn.textContent=isBookmarked(content)?'★':'☆';btn.classList.toggle('fav');btn.classList.toggle('active',isBookmarked(content));}],['👍','مفيد',(btn)=>{rateMessage(content,'up');btn.classList.toggle('rate-up');btn.classList.toggle('active');}],['👎','غير مفيد',(btn)=>{rateMessage(content,'down');btn.classList.toggle('rate-down');btn.classList.toggle('active');}],['📌','تثبيت',(btn)=>pinMessage(btn)]].forEach(([ico,ttl,fn])=>{const btn=document.createElement('button');btn.className='msg-action';if(ico==='⭐'&&isBookmarked(content)){btn.classList.add('fav','active');btn.textContent='★';}else btn.textContent=ico;btn.title=ttl;btn.addEventListener('click',()=>fn(btn));act.appendChild(btn);});bw.appendChild(act);d.appendChild(av);d.appendChild(bw);messagesArea.appendChild(d);scrollDown();if(save){totalMessages++;localStorage.setItem('totalMessages',totalMessages.toString());updateStats();saveHistory();}}

            function showTyping(){const el=document.createElement('div');el.className='message ai';el.id='typingIndicator';el.innerHTML=`<div class="avatar">🤖</div><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;messagesArea.appendChild(el);scrollDown();}
            function hideTyping(){const el=$('typingIndicator');if(el)el.remove();}
            function scrollDown(){messagesArea.scrollTop=messagesArea.scrollHeight;}
            function autoResize(){userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,90)+'px';}
            function saveHistory(){const msgs=[];messagesArea.querySelectorAll('.message').forEach(m=>{const b=m.querySelector('.bubble');if(b)msgs.push({sender:m.classList.contains('user')?'user':'ai',text:b.textContent});});localStorage.setItem('chatHistory',JSON.stringify(msgs));}
            function loadHistory(){const s=localStorage.getItem('chatHistory');if(s){try{messagesArea.innerHTML='';JSON.parse(s).forEach(m=>addMsg(m.text,m.sender,false));}catch(e){localStorage.removeItem('chatHistory');}}if(messagesArea.children.length===0){addMsg('مرحباً! 👋 أنا المساعد الأسطوري. اسألني أي شيء أو استخدم الأوامر: /calc, /convert, /weather, /joke, /time, /date, /idea, /name, /help', 'ai', false);}scrollDown();}

            function addToSearchHistory(q){if(!searchHistory.includes(q)){searchHistory.unshift(q);if(searchHistory.length>10)searchHistory.pop();localStorage.setItem('searchHistory',JSON.stringify(searchHistory));}renderHistory();}
            function renderHistory(){historyBadge.textContent=searchHistory.length;historyBar.innerHTML=searchHistory.map(h=>`<button class="hist-btn" title="${h}">${h.substring(0,30)}</button>`).join('');document.querySelectorAll('.hist-btn').forEach((btn,i)=>{btn.addEventListener('click',()=>handleSend(searchHistory[i]));});}

            function handleInternal(msg){const m=msg.trim();
                if(m.startsWith('/calc ')){const e=m.replace('/calc ','');try{return `🔢 ${e} = ${new Function(`return (${e})`)()}`;}catch(ex){return '⚠️ خطأ';}}
                if(m.startsWith('/convert ')){const p=m.replace('/convert ','').split(' ');const a=parseFloat(p[0]),f=p[1]?.toUpperCase(),t=p[3]?.toUpperCase()||p[2]?.toUpperCase();const r={USD:1,EUR:0.92,GBP:0.79,IQD:1310,SAR:3.75,AED:3.67,EGP:47.5};if(r[f]&&r[t])return `💱 ${a} ${f} = ${((a/r[f])*r[t]).toFixed(2)} ${t}`;return '⚠️ عملات: USD,EUR,GBP,IQD,SAR,AED,EGP';}
                if(m.startsWith('/weather '))return `🌤️ الطقس: ${m.replace('/weather ','')} - يحتاج API. جرب تبحث في الويب.`;
                if(m.startsWith('/time'))return `🕐 ${new Date().toLocaleString('ar-SA')}`;
                if(m.startsWith('/date'))return `📅 ${new Date().toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}`;
                if(m.startsWith('/joke')){const j=['ليش المبرمج ماينام؟ bugs','HTML بدون CSS جسم بدون روح','أفضل لغة؟ اللي تدفعلك'];return `😂 ${j[Math.floor(Math.random()*j.length)]}`;}
                if(m.startsWith('/idea')){const i=['تطبيق تعلم لغات','موقع وصفات','بوت تحليل','متجر منتجات','لعبة تعليمية'];return `💡 ${i[Math.floor(Math.random()*i.length)]}`;}
                if(m.startsWith('/name')){const n=['نور','لين','سما','فارس','آدم','جود','ليان'];return `🏷️ ${n[Math.floor(Math.random()*n.length)]}`;}
                if(m.startsWith('/help'))return `📋 الأوامر:\n/calc [معادلة]\n/convert [مبلغ] [من] to [الى]\n/weather [مدينة]\n/time\n/date\n/joke\n/idea\n/name\n/define [كلمة]\n/lyrics [أغنية]\n/diet\n/cv`;
                if(m.startsWith('/define '))return `📖 "${m.replace('/define ','')}": جرب تبحث في الويب.`;
                if(m.startsWith('/lyrics '))return `🎵 "${m.replace('/lyrics ','')}": جرب تبحث في الويب.`;
                if(m.startsWith('/diet'))return `🍳 نظام 1800 سعرة:\n🥗 فطور: بيض + خبز\n🍗 غداء: دجاج + رز\n🥦 عشاء: خضار + سمك`;
                if(m.startsWith('/cv'))return `💼 نموذج CV:\n👤 الاسم:\n🎓 التعليم:\n💼 الخبرات:\n🔧 المهارات:\n📞 التواصل:`;
                return null;
            }

            async function searchAPI(q){const internal=handleInternal(q);if(internal)return internal;
                try{const r=await fetch(`https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=2`);const d=await r.json();if(d?.query?.search?.length){const pid=d.query.search[0].pageid;const er=await fetch(`https://ar.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&pageids=${pid}&format=json&origin=*`);const ed=await er.json();const page=ed?.query?.pages?.[pid];if(page?.extract?.trim().length>20){let t=page.extract.trim().replace(/\s+/g,' ');if(t.length>500)t=t.substring(0,500)+'...';return `${t}\n\n📚 ويكيبيديا`;}}}catch(e){}
                try{const r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1`);const d=await r.json();let t=d.AbstractText?.trim()||'';if(!t&&d.RelatedTopics?.length)t=d.RelatedTopics[0].Text||'';if(t.length>10){t=t.replace(/\s+/g,' ');if(t.length>500)t=t.substring(0,500)+'...';return `${t}\n\n📚 DuckDuckGo`;}}catch(e){}
                for(const ins of ['https://searx.be','https://search.sapti.me']){try{const r=await fetch(`${ins}/search?q=${encodeURIComponent(q)}&format=json&language=auto`);if(!r.ok)continue;const d=await r.json();if(d?.results?.length){let reply='';for(let i=0;i<Math.min(d.results.length,3);i++){const x=d.results[i];const s=(x.content||x.snippet||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').substring(0,180);reply+=`📌 ${x.title||''}\n${s}\n🔗 ${x.url||''}\n\n`;}if(reply.trim())return `${reply.trim()}\n\n📚 بحث الويب`;}}catch(e){continue;}}
                return '⚠️ لم أجد نتائج. تأكد من الإنترنت.';
            }

            async function handleSend(msgText){const msg=msgText||userInput.value.trim();if(!msg||isWaiting)return;isWaiting=true;sendBtn.disabled=true;userInput.disabled=true;if(!msgText){userInput.value='';userInput.style.height='auto';charCount.textContent='';}addToSearchHistory(msg);addMsg(msg,'user');showTyping();const reply=await searchAPI(msg);hideTyping();addMsg(reply,'ai');isWaiting=false;sendBtn.disabled=false;userInput.disabled=false;userInput.focus();}

            let recognition=null;if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='ar-SA';recognition.interimResults=false;recognition.onresult=e=>{const t=e.results[0][0].transcript;userInput.value=t;handleSend(t);};recognition.onerror=()=>{micBtn.classList.remove('recording');};recognition.onend=()=>{micBtn.classList.remove('recording');};}
            micBtn.addEventListener('click',()=>{if(!recognition){showToast('⚠️ غير مدعوم');return;}if(micBtn.classList.contains('recording')){recognition.stop();micBtn.classList.remove('recording');}else{recognition.start();micBtn.classList.add('recording');showToast('🎤 تكلم...');}});

            sendBtn.addEventListener('click',()=>handleSend());
            userInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}});
            userInput.addEventListener('input',()=>{autoResize();charCount.textContent=`${userInput.value.length}/3000`;});
            document.querySelectorAll('.sug-btn').forEach(b=>b.addEventListener('click',()=>handleSend(b.dataset.q)));

            document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='k'){e.preventDefault();searchBar.classList.toggle('active');if(searchBar.classList.contains('active'))searchInput.focus();}if(e.ctrlKey&&e.key==='d'){e.preventDefault();toggleDark();}if(e.ctrlKey&&e.key==='l'){e.preventDefault();clearAll();}});

            document.querySelectorAll('#personalityModal [data-p]').forEach(btn=>{btn.addEventListener('click',()=>{personality=btn.dataset.p;localStorage.setItem('personality',personality);$('personalityModal').classList.remove('active');showToast(`🎭 ${personalities[personality].name}`);});});

            function exportChat(){const msgs=[];messagesArea.querySelectorAll('.message').forEach(m=>{const b=m.querySelector('.bubble');if(b)msgs.push({s:m.classList.contains('user')?'أنت':'AI',t:b.textContent});});let c='سجل المحادثة\n'+'='.repeat(50)+'\n\n';msgs.forEach(m=>{c+=`[${m.s}]:\n${m.t}\n${'-'.repeat(30)}\n\n`;});c+='\n© أحمد الجابري';const blob=new Blob([c],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`chat-${new Date().toISOString().slice(0,10)}.txt`;a.click();showToast('📄 تصدير');}
            function shareChat(){const msgs=[];messagesArea.querySelectorAll('.message').forEach(m=>{const b=m.querySelector('.bubble');if(b)msgs.push(b.textContent);});const text=msgs.join('\n\n---\n\n');if(navigator.share){navigator.share({title:'محادثة',text:text}).catch(()=>{});}else{copyText(text,{textContent:''});showToast('🔗 نسخ للمشاركة');}}
            function clearAll(){if(confirm('مسح كل شيء؟')){messagesArea.innerHTML='';localStorage.removeItem('chatHistory');totalMessages=0;localStorage.setItem('totalMessages','0');updateStats();addMsg('مرحباً! 👋','ai',false);showToast('🗑️ مسح');}}

            window.exportChat=exportChat;window.shareChat=shareChat;window.clearAll=clearAll;
            loadHistory();renderHistory();userInput.focus();
        })();
    </script>
</body>
</html>
