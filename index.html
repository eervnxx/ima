<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>شركة الحساب الذهني الدولية | العبقرية الذهنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #e8f0fa 0%, #d4e2f5 100%);
            color: #1a2a3a;
            overflow-x: hidden;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar-right {
            width: 280px;
            background: linear-gradient(180deg, #1E3A5F 0%, #143250 100%);
            box-shadow: -4px 0 25px rgba(0, 0, 0, 0.12);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .logo-area {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }

        .logo-area h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
        }

        .logo-area p {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 5px;
            color: #b8d4f0;
        }

        .site-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #27AE60;
            background: white;
            padding: 3px;
        }

        .nav-menu {
            flex: 1;
            padding: 25px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 25px;
            margin: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #d0e4f5;
        }

        .nav-item i {
            width: 28px;
            font-size: 1.25rem;
            text-align: center;
        }

        .nav-item.active {
            background: #27AE60;
            color: white;
            box-shadow: 0 8px 16px rgba(39, 174, 96, 0.3);
        }

        .nav-item.active i {
            color: white;
        }

        .nav-item:hover:not(.active) {
            background: rgba(39, 174, 96, 0.2);
            color: white;
            transform: translateX(-5px);
        }

        .main-content {
            flex: 1;
            padding: 30px 35px;
            overflow-y: auto;
            background: #F8FAFE;
        }

        .page-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 28px 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .page-card:hover {
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 20px;
            border-right: 6px solid #27AE60;
            padding-right: 20px;
            color: #1E3A5F;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .school-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border: 1px solid #eef2f9;
            transition: all 0.3s ease;
            position: relative;
        }
        .school-card:hover { 
            transform: translateY(-6px); 
            border-color: #27AE60;
            box-shadow: 0 15px 30px rgba(39, 174, 96, 0.1);
        }

        .school-name {
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #1E3A5F;
        }

        .btn-pro {
            background: #27AE60;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            color: white;
            margin: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-pro:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(39, 174, 96, 0.3);
        }

        .btn-pro:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-edit {
            background: #3498db;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .contract-img-preview {
            margin-top: 12px;
            width: 100%;
            border-radius: 16px;
            border: 2px solid #eef2f9;
            max-height: 140px;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.2s;
        }

        .contract-img-preview:hover {
            border-color: #27AE60;
            transform: scale(1.02);
        }

        .upload-area {
            background: #F0F5FB;
            border-radius: 28px;
            padding: 20px;
            margin-top: 20px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin: 25px 0;
            border-radius: 28px;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
        }

        .system-steps {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }
        .step {
            flex: 1;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6d9 100%);
            padding: 20px;
            border-radius: 28px;
            text-align: center;
            transition: all 0.3s;
        }
        .step:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.2);
        }
        .step i {
            font-size: 2.5rem;
            color: #27AE60;
            margin-bottom: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
        }
        .modal-content img {
            width: 100%;
            border-radius: 20px;
            margin: 15px 0;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #e74c3c;
        }

        .trash-card {
            background: #fff5f0;
            border-right: 4px solid #e74c3c;
        }

        input, textarea, select {
            font-family: 'Tajawal', sans-serif;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: #6c86a3;
        }

        @media (max-width: 850px) {
            .dashboard {
                flex-direction: column-reverse;
            }
            .sidebar-right {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            .nav-menu {
                display: flex;
                padding: 10px;
            }
            .nav-item {
                white-space: nowrap;
                padding: 10px 18px;
            }
            .logo-area {
                display: none;
            }
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="sidebar-right">
        <div class="logo-area" id="logoArea">
            <img id="siteLogo" class="site-logo" src="" style="display: none;" alt="شعار الموقع">
            <h2 id="siteTitle">الحساب الذهني</h2>
            <p>الدولية · Mental Math</p>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" data-page="home">
                <i class="fas fa-home"></i> <span>الرئيسية</span>
            </div>
            <div class="nav-item" data-page="schools">
                <i class="fas fa-school"></i> <span>المدارس المتعاقدة</span>
            </div>
            <div class="nav-item" data-page="addContract">
                <i class="fas fa-file-signature"></i> <span>إضافة عقود</span>
            </div>
            <div class="nav-item" data-page="system">
                <i class="fas fa-cogs"></i> <span>نظام العمل</span>
            </div>
            <div class="nav-item" data-page="settings">
                <i class="fas fa-sliders-h"></i> <span>الإعدادات</span>
            </div>
        </div>
        <div style="padding: 20px; font-size: 0.7rem; text-align: center; border-top:1px solid rgba(255,255,255,0.1);">
            <i class="fas fa-brain"></i> تعليم المستقبل
        </div>
    </div>

    <div class="main-content" id="dynamicPageContainer">
        <div style="text-align:center; padding: 60px;">جاري التحميل...</div>
    </div>
</div>

<div id="contractModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle" style="color:#1E3A5F;">تفاصيل العقد</h3>
        <img id="modalImage" src="" alt="صورة العقد">
        <p id="modalDesc"></p>
    </div>
</div>

<script>
    // بيانات المدارس والعقود
    let schoolsData = [
        { id: 1, name: "مدارس الرياض الأهلية", contractImage: "https://picsum.photos/id/20/300/200", contractDesc: "عقد تعاون 2025" },
        { id: 2, name: "مدارس النخبة العالمية", contractImage: "https://picsum.photos/id/26/300/200", contractDesc: "اتفاقية تجديد 2025" },
        { id: 3, name: "أكاديمية العباقرة", contractImage: "https://picsum.photos/id/28/300/200", contractDesc: "عقد حصري" }
    ];
    
    // سلة المهملات
    let trashBin = [];
    
    // بيانات اللوكو
    let siteLogoUrl = localStorage.getItem("siteLogo") || "";

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // تحديث اللوكو في القائمة الجانبية
    function updateSiteLogo() {
        const logoImg = document.getElementById("siteLogo");
        const siteTitle = document.getElementById("siteTitle");
        if(siteLogoUrl && siteLogoUrl !== "") {
            logoImg.src = siteLogoUrl;
            logoImg.style.display = "block";
            siteTitle.style.display = "none";
        } else {
            logoImg.style.display = "none";
            siteTitle.style.display = "block";
        }
    }

    function showContract(school) {
        document.getElementById("modalTitle").innerText = school.name;
        document.getElementById("modalImage").src = school.contractImage;
        document.getElementById("modalDesc").innerText = school.contractDesc;
        document.getElementById("contractModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("contractModal").style.display = "none";
    }

    // حذف عقد (نقله لسلة المهملات)
    function deleteToTrash(id) {
        let school = schoolsData.find(s => s.id === id);
        if(school) {
            trashBin.push({ ...school, deletedAt: new Date().toLocaleString() });
            schoolsData = schoolsData.filter(s => s.id !== id);
            refreshSchoolsPage();
            alert("تم نقل العقد إلى سلة المهملات!");
        }
    }

    // استعادة عقد من سلة المهملات
    function restoreFromTrash(id) {
        let item = trashBin.find(t => t.id === id);
        if(item) {
            schoolsData.push({ ...item });
            trashBin = trashBin.filter(t => t.id !== id);
            renderSettingsPage();
            refreshSchoolsPage();
            alert("تم استعادة العقد بنجاح!");
        }
    }

    // حذف نهائي من سلة المهملات
    function permanentDelete(id) {
        if(confirm("هل أنت متأكد من الحذف النهائي؟ لا يمكن التراجع!")) {
            trashBin = trashBin.filter(t => t.id !== id);
            renderSettingsPage();
            alert("تم الحذف النهائي!");
        }
    }

    function renderSchoolsPage() {
        let html = `<div class="page-card"><div class="section-title"><i class="fas fa-handshake"></i> المدارس المتعاقدة مع الشركة</div>
                    <div class="grid-cards">`;
        schoolsData.forEach(school => {
            html += `<div class="school-card">
                        <div class="school-name"><i class="fas fa-building"></i> ${escapeHtml(school.name)}</div>
                        <div style="font-size:0.8rem; color:#6c757d;">عقد: ${escapeHtml(school.contractDesc)}</div>
                        <img src="${school.contractImage}" alt="صورة العقد" class="contract-img-preview" onclick='showContract(${JSON.stringify(school).replace(/'/g, "&#39;")})' onerror="this.src='https://via.placeholder.com/300x150?text=صورة+العقد'">
                        <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn-pro" onclick='showContract(${JSON.stringify(school).replace(/'/g, "&#39;")})'><i class="fas fa-eye"></i> عرض</button>
                            <button class="btn-pro btn-edit" onclick="editContract(${school.id})"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="btn-pro btn-danger" onclick="deleteToTrash(${school.id})"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                     </div>`;
        });
        if(schoolsData.length === 0) {
            html += `<div style="text-align:center; padding:40px;">لا توجد عقود حالياً <i class="fas fa-folder-open"></i></div>`;
        }
        html += `</div></div>`;
        return html;
    }

    // صفحة إضافة عقود (رفع صورة فقط من الجهاز)
    function renderAddContractPage() {
        return `
        <div class="page-card">
            <div class="section-title"><i class="fas fa-plus-circle"></i> إضافة مدرسة متعاقدة جديدة</div>
            <div class="upload-area">
                <label style="font-weight:bold;">اسم المدرسة:</label>
                <input type="text" id="newSchoolName" placeholder="مثال: مدارس المستقبل" style="width:100%; padding:12px; margin:10px 0; border-radius:60px; border:1px solid #ccc;">
                
                <label style="font-weight:bold;">وصف العقد:</label>
                <input type="text" id="newContractDesc" placeholder="عقد تعاون 2026" style="width:100%; padding:12px; margin:10px 0; border-radius:60px; border:1px solid #ccc;">
                
                <label style="font-weight:bold;">صورة العقد (رفع من الجهاز):</label>
                <input type="file" id="contractUploadFile" accept="image/*" style="margin:10px 0; display:block;" required>
                <div style="font-size:0.8rem; color:gray;">📸 يرجى اختيار صورة العقد من جهازك</div>
                
                <button class="btn-pro" id="btnAddSchool" style="margin-top:15px;"><i class="fas fa-save"></i> إضافة المدرسة والعقد</button>
                <div id="addMsg" style="margin-top:10px; color:#27AE60;"></div>
            </div>
        </div>`;
    }

    // صفحة الإعدادات (سلة المهملات + رفع لوكو)
    function renderSettingsPage() {
        let trashHtml = `<div class="page-card">
            <div class="section-title"><i class="fas fa-trash-alt"></i> سلة المهملات</div>
            <div class="grid-cards">`;
        
        if(trashBin.length === 0) {
            trashHtml += `<div style="text-align:center; padding:40px;">📭 سلة المهملات فارغة</div>`;
        } else {
            trashBin.forEach(item => {
                trashHtml += `<div class="school-card trash-card">
                    <div class="school-name"><i class="fas fa-building"></i> ${escapeHtml(item.name)}</div>
                    <div style="font-size:0.7rem; color:#e74c3c;">تم الحذف: ${item.deletedAt}</div>
                    <div style="font-size:0.8rem; color:#6c757d;">عقد: ${escapeHtml(item.contractDesc)}</div>
                    <img src="${item.contractImage}" style="max-height:80px; object-fit:cover; border-radius:12px; margin:10px 0;">
                    <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn-pro btn-warning" onclick="restoreFromTrash(${item.id})"><i class="fas fa-recycle"></i> استعادة</button>
                        <button class="btn-pro btn-danger" onclick="permanentDelete(${item.id})"><i class="fas fa-trash-alt"></i> حذف نهائي</button>
                    </div>
                </div>`;
            });
        }
        trashHtml += `</div></div>`;
        
        // قسم رفع اللوكو
        trashHtml += `<div class="page-card">
            <div class="section-title"><i class="fas fa-image"></i> تغيير شعار الموقع (لوكو)</div>
            <div class="upload-area">
                <label style="font-weight:bold;">رفع صورة اللوكو:</label>
                <input type="file" id="logoUploadFile" accept="image/*" style="margin:10px 0; display:block;">
                <button class="btn-pro" id="btnUploadLogo"><i class="fas fa-upload"></i> رفع اللوكو</button>
                <button class="btn-pro btn-danger" id="btnRemoveLogo" style="background:#95a5a6;"><i class="fas fa-times"></i> إزالة اللوكو</button>
                <div id="logoMsg" style="margin-top:10px; color:#27AE60;"></div>
            </div>
        </div>`;
        
        return trashHtml;
    }

    function renderSystemPage() {
        return `
        <div class="page-card">
            <div class="section-title"><i class="fas fa-chalkboard-user"></i> نظام عمل شركة الحساب الذهني الدولية</div>
            <p style="font-size:1.1rem; line-height:1.6;">تعتمد شركة الحساب الذهني على منهجية تدريب العقل باستخدام العداد الذهني (السوروبان) لتنشيط نصفي الكرة المخية، مما ينمي القدرات الحسابية، التركيز، والذاكرة. يتم تقديم البرنامج على مراحل تدريجية من المستوى المبتدئ إلى الاحترافي.</p>
            
            <div class="system-steps">
                <div class="step"><i class="fas fa-child"></i><h3>التقييم الأولي</h3><p>تحديد مستوى الطالب ووضعه في المسار المناسب</p></div>
                <div class="step"><i class="fas fa-brain"></i><h3>التدريب الذهني</h3><p>تمارين السوروبان والتصور الذهني</p></div>
                <div class="step"><i class="fas fa-trophy"></i><h3>المسابقات والشهادات</h3><p>شهادات معتمدة ومشاركات دولية</p></div>
            </div>
            <h3 style="margin:15px 0 10px 0;"><i class="fas fa-video"></i> فيديو توضيحي عن الحساب الذهني</h3>
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/8e3nNuJ_aBY" title="العبقرية الذهنية - الحساب الذهني" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <p><i class="fas fa-check-circle" style="color:#27AE60;"></i> برامجنا معتمدة من منظمات تعليمية عالمية، وتشمل التدريب عبر الإنترنت واللقاءات المباشرة مع مدربين معتمدين.</p>
            <footer style="margin-top:30px;">© 2025 شركة الحساب الذهني الدولية - نحو عقول مبدعة</footer>
        </div>`;
    }

    function renderHomePage() {
        return `
        <div class="page-card">
            <div class="section-title">مرحباً بكم في <span style="color:#27AE60;">شركة الحساب الذهني الدولية</span></div>
            <p style="font-size:1.15rem; line-height:1.6;">نحن الشركة الرائدة في تعليم الحساب الذهني وتنمية المهارات العقلية للأطفال والناشئين. نتعاون مع أكثر من 100 مدرسة حول العالم، ونقدم عقود شراكة مميزة.</p>
            <div style="background: linear-gradient(135deg, #e8f5e9 0%, #d5f0e5 100%); border-radius: 28px; padding: 20px; margin: 30px 0;">
                <i class="fas fa-chart-line" style="font-size: 2rem; color:#27AE60;"></i>
                <h3 style="color:#1E3A5F;">رؤيتنا: جيل ذهني مبدع</h3>
                <p>من خلال منهجية فريدة تجمع بين الحساب الذهني وتقنيات التصور، نضمن تفوق الطلاب في جميع المواد الدراسية.</p>
            </div>
            <div><i class="fas fa-hand-peace"></i> اختر من القائمة اليمنى لعرض المدارس المتعاقدة، إضافة عقود جديدة، أو الاطلاع على نظام العمل.</div>
        </div>
        `;
    }

    function editContract(id) {
        let school = schoolsData.find(s => s.id === id);
        if(!school) return;
        let newName = prompt("تعديل اسم المدرسة:", school.name);
        let newDesc = prompt("تعديل وصف العقد:", school.contractDesc);
        let newImage = prompt("تعديل رابط صورة العقد:", school.contractImage);
        if(newName && newName.trim()) school.name = newName.trim();
        if(newDesc && newDesc.trim()) school.contractDesc = newDesc.trim();
        if(newImage && newImage.trim()) school.contractImage = newImage.trim();
        refreshSchoolsPage();
        alert("تم تعديل العقد بنجاح!");
    }

    let currentPage = "home";
    function loadPage(pageId) {
        currentPage = pageId;
        const container = document.getElementById("dynamicPageContainer");
        if (!container) return;
        if (pageId === "home") {
            container.innerHTML = renderHomePage();
        } else if (pageId === "schools") {
            container.innerHTML = renderSchoolsPage();
        } else if (pageId === "addContract") {
            container.innerHTML = renderAddContractPage();
            attachAddContractEvents();
        } else if (pageId === "system") {
            container.innerHTML = renderSystemPage();
        } else if (pageId === "settings") {
            container.innerHTML = renderSettingsPage();
            attachSettingsEvents();
        } else {
            container.innerHTML = renderHomePage();
        }
    }

    function refreshSchoolsPage() {
        if (currentPage === "schools") {
            const container = document.getElementById("dynamicPageContainer");
            if (container) container.innerHTML = renderSchoolsPage();
        }
    }

    function attachAddContractEvents() {
        const btnAdd = document.getElementById("btnAddSchool");
        if (btnAdd) {
            btnAdd.onclick = () => {
                const nameInput = document.getElementById("newSchoolName");
                const descInput = document.getElementById("newContractDesc");
                const fileInput = document.getElementById("contractUploadFile");
                
                let schoolName = nameInput?.value.trim();
                let contractDesc = descInput?.value.trim();
                let file = fileInput?.files[0];
                
                if (!schoolName) {
                    alert("يرجى إدخال اسم المدرسة");
                    return;
                }
                if (!file) {
                    alert("يرجى اختيار صورة العقد من جهازك");
                    return;
                }
                if (!contractDesc) contractDesc = "عقد شراكة";
                
                const objectUrl = URL.createObjectURL(file);
                schoolsData.push({
                    id: Date.now(),
                    name: schoolName,
                    contractImage: objectUrl,
                    contractDesc: contractDesc
                });
                
                nameInput.value = "";
                descInput.value = "";
                fileInput.value = "";
                
                document.getElementById("addMsg").innerHTML = `✅ تم إضافة المدرسة "${schoolName}" بنجاح!`;
                refreshSchoolsPage();
                setTimeout(() => {
                    const msgDiv = document.getElementById("addMsg");
                    if(msgDiv) msgDiv.innerHTML = "";
                }, 3000);
            };
        }
    }

    function attachSettingsEvents() {
        const uploadLogoBtn = document.getElementById("btnUploadLogo");
        const removeLogoBtn = document.getElementById("btnRemoveLogo");
        const logoFile = document.getElementById("logoUploadFile");
        
        if(uploadLogoBtn) {
            uploadLogoBtn.onclick = () => {
                const file = logoFile?.files[0];
                if(!file) {
                    alert("الرجاء اختيار صورة للوكو أولاً");
                    return;
                }
                const objectUrl = URL.createObjectURL(file);
                siteLogoUrl = objectUrl;
                localStorage.setItem("siteLogo", objectUrl);
                updateSiteLogo();
                document.getElementById("logoMsg").innerHTML = "✅ تم تغيير شعار الموقع بنجاح!";
                setTimeout(() => {
                    const msgDiv = document.getElementById("logoMsg");
                    if(msgDiv) msgDiv.innerHTML = "";
                }, 3000);
            };
        }
        
        if(removeLogoBtn) {
            removeLogoBtn.onclick = () => {
                siteLogoUrl = "";
                localStorage.removeItem("siteLogo");
                updateSiteLogo();
                document.getElementById("logoMsg").innerHTML = "✅ تم إزالة الشعار بنجاح!";
                setTimeout(() => {
                    const msgDiv = document.getElementById("logoMsg");
                    if(msgDiv) msgDiv.innerHTML = "";
                }, 3000);
            };
        }
    }

    function initNavigation() {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                const page = this.getAttribute('data-page');
                if (!page) return;
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                loadPage(page);
            });
        });
    }

    function init() {
        updateSiteLogo();
        initNavigation();
        loadPage('home');
    }

    init();
</script>
</body>
</html>
