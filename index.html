<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>شركة الحساب الذهني الدولية | منصة العقود الذكية</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f9f5;
            color: #1a2e3c;
            overflow-x: hidden;
        }

        /* الحاوية الرئيسية: تخطيط ثنائي الأعمدة (يمين: شريط طولي، يسار: المحتوى) */
        .app-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* شريط التنقل الطولي (عمودي) على الجانب الأيمن */
        .vertical-navbar {
            width: 280px;
            background: linear-gradient(165deg, #0b3b2f, #0c4a3a);
            box-shadow: -8px 0 25px rgba(0, 30, 20, 0.2);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 30;
            transition: all 0.2s;
            border-left: 1px solid #2ecc71;
        }

        /* منطقة الشعار */
        .brand-logo {
            padding: 35px 20px 25px;
            text-align: center;
            border-bottom: 2px solid #2ecc71;
            margin-bottom: 30px;
        }
        .brand-logo h2 {
            font-size: 1.7rem;
            font-weight: 800;
            color: #e0ffec;
            letter-spacing: -0.3px;
        }
        .brand-logo p {
            font-size: 0.7rem;
            color: #a3e4c1;
            margin-top: 6px;
        }

        /* القائمة العمودية */
        .nav-menu-vertical {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px;
        }

        .nav-item-vertical {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #eefcf5;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px);
        }
        .nav-item-vertical i {
            width: 28px;
            font-size: 1.3rem;
            text-align: center;
        }
        .nav-item-vertical.active {
            background: #2ecc71;
            color: #0a2f2f;
            box-shadow: 0 8px 18px rgba(46, 204, 113, 0.3);
        }
        .nav-item-vertical:hover:not(.active) {
            background: #1f8a55;
            transform: translateX(-3px);
        }

        /* منطقة المحتوى الرئيسي (الجهة اليسرى) */
        .main-content-panel {
            flex: 1;
            padding: 32px 38px;
            overflow-y: auto;
            background: #f8fefb;
        }

        /* البطاقات والتصميم الاحترافي */
        .glass-panel {
            background: #ffffff;
            border-radius: 42px;
            padding: 30px 36px;
            box-shadow: 0 25px 45px -12px rgba(0, 32, 20, 0.1);
            margin-bottom: 32px;
            border: 1px solid rgba(46, 204, 113, 0.25);
            transition: 0.2s;
        }

        .section-header {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 28px;
            border-right: 7px solid #2ecc71;
            padding-right: 22px;
            color: #0b4a38;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* شبكة المدارس */
        .schools-masonry {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .school-tile {
            background: #ffffff;
            border-radius: 32px;
            padding: 20px;
            transition: all 0.25s;
            border: 1px solid #e0f2e9;
            box-shadow: 0 6px 12px rgba(0,0,0,0.02);
        }
        .school-tile:hover {
            transform: translateY(-6px);
            border-color: #2ecc71;
            box-shadow: 0 18px 30px -12px rgba(46,204,113,0.2);
        }
        .school-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1d6f48;
            margin-bottom: 6px;
        }
        .contract-badge {
            background: #e8f5ee;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 12px 0 10px;
            color: #0f6e44;
        }
        .contract-img-card {
            width: 100%;
            max-height: 170px;
            object-fit: cover;
            border-radius: 24px;
            margin: 12px 0;
            border: 1px solid #c8eedb;
            cursor: pointer;
            background: #f9fff9;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn-sm {
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-edit-school { background: #e3f2fd; color: #0a6e9e; }
        .btn-delete-school { background: #fee9e6; color: #c0392b; }
        .btn-edit-school:hover { background: #cfe6fc; }
        .btn-delete-school:hover { background: #fcd5ce; }

        /* نموذج إضافة مدرسة حديث */
        .form-elegant {
            background: #fafffd;
            border-radius: 36px;
            padding: 28px;
            margin-top: 15px;
            border: 1px solid #d9f0e5;
        }
        .field {
            margin-bottom: 22px;
        }
        .field label {
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
            color: #1e6a48;
        }
        .field input, .field textarea {
            width: 100%;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1.5px solid #cbeadd;
            font-family: 'Cairo', sans-serif;
            background: white;
            font-size: 0.95rem;
        }
        .field textarea {
            border-radius: 28px;
            resize: vertical;
        }
        .field input:focus, .field textarea:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46,204,113,0.2);
        }
        .btn-success {
            background: #2ecc71;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 800;
            color: #0a2f2f;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-success:hover {
            background: #27ae60;
            transform: scale(1.01);
        }
        /* فيديو ونظام العمل */
        .steps-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 35px 0;
        }
        .step-item {
            flex: 1;
            background: #edfaf2;
            padding: 22px 18px;
            border-radius: 32px;
            text-align: center;
        }
        .video-box iframe {
            width: 100%;
            border-radius: 36px;
            min-height: 300px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.05);
        }
        footer {
            text-align: center;
            margin-top: 45px;
            font-size: 0.8rem;
            color: #5c9c7e;
        }
        @media (max-width: 900px) {
            .app-layout {
                flex-direction: column;
            }
            .vertical-navbar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            .brand-logo {
                display: none;
            }
            .nav-menu-vertical {
                flex-direction: row;
                flex-wrap: nowrap;
                padding: 8px;
            }
            .nav-item-vertical {
                white-space: nowrap;
                padding: 10px 20px;
            }
            .main-content-panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="app-layout">
    <!-- شريط التنقل الطولي على الجانب الأيمن (عمودي بالكامل) -->
    <div class="vertical-navbar">
        <div class="brand-logo">
            <h2>الحساب الذهني</h2>
            <p>الدولية · عقود ذكية</p>
        </div>
        <div class="nav-menu-vertical">
            <div class="nav-item-vertical active" data-page="home">
                <i class="fas fa-home"></i> <span>الرئيسية</span>
            </div>
            <div class="nav-item-vertical" data-page="schools">
                <i class="fas fa-school"></i> <span>المدارس & العقود</span>
            </div>
            <div class="nav-item-vertical" data-page="addContract">
                <i class="fas fa-plus-circle"></i> <span>إضافة مدرسة جديدة</span>
            </div>
            <div class="nav-item-vertical" data-page="system">
                <i class="fas fa-chalkboard-user"></i> <span>نظام العمل & فيديو</span>
            </div>
        </div>
        <div style="margin-top: auto; text-align: center; padding: 25px 15px; font-size: 0.7rem; color: #9bdfbc;">
            <i class="fas fa-brain"></i> تمكين العقول
        </div>
    </div>

    <!-- المحتوى الرئيسي (الجهة اليسرى) -->
    <div class="main-content-panel" id="mainPanel">
        <div class="glass-panel" style="text-align: center;">جاري تحميل المنصة...</div>
    </div>
</div>

<script>
    // -------------------- قاعدة بيانات المدارس والعقود --------------------
    let schoolsDatabase = [
        { id: 101, name: "مدارس الأفق الذهبي", contractDesc: "عقد شراكة استراتيجي 2025 - تجديد", imageData: "https://picsum.photos/id/42/300/180" },
        { id: 102, name: "أكاديمية العباقرة الدولي", contractDesc: "اتفاقية تدريب الحساب الذهني", imageData: "https://picsum.photos/id/26/300/180" },
        { id: 103, name: "مدارس النخبة الحديثة", contractDesc: "عقد حصري لمدة 3 سنوات", imageData: "https://picsum.photos/id/20/300/180" }
    ];

    // تحويل ملف الصورة إلى Base64 (للتخزين الدائم)
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // عرض صفحة المدارس المتعاقدة مع إمكانية التعديل والحذف
    function renderSchoolsPage() {
        let html = `<div class="glass-panel">
            <div class="section-header"><i class="fas fa-handshake"></i> المدارس المتعاقدة مع الشركة وعقودها</div>
            <div class="schools-masonry" id="schoolsListContainer">`;
        
        if (schoolsDatabase.length === 0) {
            html += `<div style="grid-column:1/-1; text-align:center; padding: 50px;">لا توجد مدارس مسجلة حتى الآن، أضف مدرسة جديدة من القائمة.</div>`;
        } else {
            schoolsDatabase.forEach(school => {
                html += `
                    <div class="school-tile" data-id="${school.id}">
                        <div class="school-title"><i class="fas fa-landmark"></i> ${escapeHtml(school.name)}</div>
                        <div class="contract-badge"><i class="fas fa-file-contract"></i> ${escapeHtml(school.contractDesc)}</div>
                        <img src="${school.imageData}" class="contract-img-card" alt="صورة العقد" onerror="this.src='https://placehold.co/300x180?text=عقد+تجريبي'">
                        <div class="btn-group">
                            <button class="btn-sm btn-edit-school" onclick="editSchoolItem(${school.id})"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="btn-sm btn-delete-school" onclick="deleteSchoolItem(${school.id})"><i class="fas fa-trash-alt"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
        }
        html += `</div></div>`;
        return html;
    }

    // صفحة إضافة مدرسة جديدة (رفع صورة من الجهاز فقط + تسجيل البيانات دفعة واحدة)
    function renderAddSchoolForm() {
        return `
        <div class="glass-panel">
            <div class="section-header"><i class="fas fa-plus-circle"></i> إضافة مدرسة متعاقدة جديدة (مع رفع العقد)</div>
            <div class="form-elegant">
                <div class="field">
                    <label><i class="fas fa-building"></i> اسم المدرسة <span style="color:#e67e22;">*</span></label>
                    <input type="text" id="newSchoolName" placeholder="مثال: مدارس الحساب الذهني النموذجية">
                </div>
                <div class="field">
                    <label><i class="fas fa-file-signature"></i> وصف العقد / التفاصيل</label>
                    <textarea id="newContractDesc" rows="2" placeholder="عقد شراكة ممتد 2026، حقوق التدريب..."></textarea>
                </div>
                <div class="field">
                    <label><i class="fas fa-image"></i> رفع صورة العقد (من جهازك فقط) *</label>
                    <input type="file" id="contractImageUpload" accept="image/jpeg,image/png,image/jpg,image/webp">
                    <div style="font-size:0.7rem; margin-top:6px; color:#2c6e49;">⚠️ يرجى اختيار صورة العقد أو الاتفاقية (jpg/png)</div>
                </div>
                <button class="btn-success" id="submitNewSchool"><i class="fas fa-save"></i> تسجيل المدرسة والعقد</button>
                <div id="formFeedbackMsg" style="margin-top: 20px; font-weight: 500;"></div>
            </div>
        </div>`;
    }

    // صفحة نظام العمل + فيديو توضيحي
    function renderSystemPage() {
        return `
        <div class="glass-panel">
            <div class="section-header"><i class="fas fa-gear"></i> نظام عمل شركة الحساب الذهني الدولية</div>
            <p style="font-size:1.05rem; line-height:1.7;">تعتمد الشركة على منهجية متكاملة معتمدة عالمياً في تنمية الذكاء والتركيز عبر برنامج الحساب الذهني (Mental Math & Soroban). يتم التدريب عبر مراحل احترافية.</p>
            <div class="steps-flex">
                <div class="step-item"><i class="fas fa-chalkboard-user" style="font-size:2rem; color:#2ecc71;"></i><h3>التأسيس</h3><p>تعلم أساسيات السوروبان والأرقام</p></div>
                <div class="step-item"><i class="fas fa-brain" style="font-size:2rem; color:#2ecc71;"></i><h3>التصور الذهني</h3><p>الانتقال للحساب الذهني بدون عداد</p></div>
                <div class="step-item"><i class="fas fa-trophy" style="font-size:2rem; color:#2ecc71;"></i><h3>الاحتراف والمسابقات</h3><p>شهادات دولية ومشاركات عالمية</p></div>
            </div>
            <h3 style="margin: 25px 0 12px 0;"><i class="fas fa-video"></i> فيديو توضيحي عن الحساب الذهني</h3>
            <div class="video-box">
                <iframe width="100%" height="340" src="https://www.youtube.com/embed/8e3nNuJ_aBY" title="شرح الحساب الذهني" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <footer>برامجنا معتمدة من منظمات تعليمية رائدة، نضمن تفوق الطلاب في جميع المواد.</footer>
        </div>`;
    }

    // الصفحة الرئيسية الترحيبية
    function renderHomePage() {
        return `
        <div class="glass-panel">
            <div class="section-header"><i class="fas fa-crown"></i> شركة الحساب الذهني الدولية</div>
            <p style="font-size:1.15rem; font-weight:500; line-height:1.6;">نحن الرائدون في تعليم الحساب الذهني وتطوير المهارات العقلية للأطفال والناشئين، نتعاون مع أكثر من 150 مدرسة حول العالم ونقدم عقوداً رقمية موثقة.</p>
            <div style="background: linear-gradient(115deg, #e4f7ed, #ffffff); border-radius: 32px; padding: 28px; margin: 30px 0;">
                <i class="fas fa-chart-line" style="font-size: 2rem; color:#2ecc71;"></i>
                <h3>رؤيتنا: قادة الحساب الذهني</h3>
                <p>✔ إدارة رقمية للعقود والصور<br>✔ سهولة إضافة وتعديل بيانات المدارس<br>✔ نظام تفاعلي احترافي</p>
            </div>
            <div><i class="fas fa-arrow-left"></i> استخدم القائمة الطولية على اليمين لإدارة المدارس والعقود أو مشاهدة نظام العمل.</div>
        </div>`;
    }

    // دوال التعديل والحذف العامة (متاحة في النطاق العام)
    window.editSchoolItem = async function(id) {
        const school = schoolsDatabase.find(s => s.id === id);
        if (!school) return;
        const newName = prompt("✏️ تعديل اسم المدرسة:", school.name);
        if (newName && newName.trim() !== "") school.name = newName.trim();
        const newDesc = prompt("📄 تعديل وصف العقد:", school.contractDesc);
        if (newDesc !== null) school.contractDesc = newDesc;
        const changeImage = confirm("هل ترغب في تغيير صورة العقد؟ (اختر نعم لرفع صورة جديدة من جهازك)");
        if (changeImage) {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const base64Img = await fileToBase64(file);
                    school.imageData = base64Img;
                    refreshCurrentPage();
                } else {
                    refreshCurrentPage();
                }
            };
            fileInput.click();
        } else {
            refreshCurrentPage();
        }
    };

    window.deleteSchoolItem = function(id) {
        if (confirm("⚠️ حذف المدرسة وجميع بيانات العقد بشكل نهائي؟")) {
            schoolsDatabase = schoolsDatabase.filter(s => s.id !== id);
            refreshCurrentPage();
        }
    };

    // تحديث الصفحة الحالية بناءً على التبويب النشط
    let currentPageId = "home";
    function refreshCurrentPage() {
        if (currentPageId === "home") loadPage("home");
        else if (currentPageId === "schools") loadPage("schools");
        else if (currentPageId === "addContract") loadPage("addContract");
        else if (currentPageId === "system") loadPage("system");
    }

    async function loadPage(pageName) {
        currentPageId = pageName;
        const container = document.getElementById("mainPanel");
        if (!container) return;
        if (pageName === "home") {
            container.innerHTML = renderHomePage();
        } else if (pageName === "schools") {
            container.innerHTML = renderSchoolsPage();
        } else if (pageName === "addContract") {
            container.innerHTML = renderAddSchoolForm();
            // ربط حدث إضافة المدرسة مع رفع صورة واحدة
            const submitBtn = document.getElementById("submitNewSchool");
            if (submitBtn) {
                submitBtn.onclick = async () => {
                    const nameField = document.getElementById("newSchoolName");
                    const descField = document.getElementById("newContractDesc");
                    const fileField = document.getElementById("contractImageUpload");
                    const schoolName = nameField?.value.trim();
                    if (!schoolName) {
                        document.getElementById("formFeedbackMsg").innerHTML = '<span style="color:#c0392b;">❌ يرجى إدخال اسم المدرسة</span>';
                        return;
                    }
                    if (!fileField.files || fileField.files.length === 0) {
                        document.getElementById("formFeedbackMsg").innerHTML = '<span style="color:#c0392b;">❌ يجب رفع صورة العقد من جهازك (صورة أو مستند)</span>';
                        return;
                    }
                    const file = fileField.files[0];
                    const base64Image = await fileToBase64(file);
                    const contractDesc = descField?.value.trim() || "عقد شراكة مع شركة الحساب الذهني الدولية";
                    const newId = Date.now();
                    schoolsDatabase.push({
                        id: newId,
                        name: schoolName,
                        contractDesc: contractDesc,
                        imageData: base64Image
                    });
                    // مسح الحقول
                    nameField.value = "";
                    if (descField) descField.value = "";
                    fileField.value = "";
                    document.getElementById("formFeedbackMsg").innerHTML = '<span style="color:#27ae60;">✅ تمت إضافة المدرسة والعقد بنجاح!</span>';
                    setTimeout(() => {
                        const msgDiv = document.getElementById("formFeedbackMsg");
                        if(msgDiv) msgDiv.innerHTML = "";
                    }, 2800);
                    // الانتقال إلى صفحة المدارس بعد الإضافة (اختياري)
                    const goToSchools = confirm("تمت الإضافة بنجاح! هل تريد الانتقال إلى قائمة المدارس الآن؟");
                    if (goToSchools) {
                        document.querySelector('[data-page="schools"]').click();
                    } else {
                        refreshCurrentPage();
                    }
                };
            }
        } else if (pageName === "system") {
            container.innerHTML = renderSystemPage();
        }
    }

    // دالة للحماية من XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ربط التنقل بين الصفحات
    function bindNavigation() {
        const navItems = document.querySelectorAll('.nav-item-vertical');
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                const page = this.getAttribute('data-page');
                if (!page) return;
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                loadPage(page);
            });
        });
    }
